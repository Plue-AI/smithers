# Pins the toolchain that builds the crates/ workspace and the committed
# `packages/smithers/flows/jj/wasm/flows_jj.wasm` artifact. CI rebuilds the wasm with this
# exact toolchain and fails on byte drift (see ci.yml's wasm-repro job), so
# bumping the channel means rebuilding and recommitting the artifact with
# `node crates/flows-jj/build-wasm.mjs` in the same change, on the host the
# artifact is built for — `x86_64-unknown-linux-gnu`. The script refuses to
# build it on any other host and prints the container command; its header
# explains why the bytes are host-specific.
#
# This is the one Rust toolchain in the repository: CI, release, Cloud and the
# distribution image all build with this channel, and
# `scripts/check-toolchain-pins.mjs` fails on any other release they name.
# smithers-ffi sets its floor: its exact `yrs` pin uses `if let` match guards,
# which 1.89 rejects. The committed artifact's `producers` section records the
# same release. The minimal profile is deliberate: `rust-src` stays uninstalled so
# rustc keeps std spans on their `/rustc/<commit-hash>` form (build-wasm.mjs
# remaps the translated form back for toolchains that do have it).
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-wasip1"]
