# Cargo workspace for the Rust side of flows.
#
# The single jj implementation is vendored at its pinned upstream revision;
# native capture extends its path representation without changing Git names.

[workspace]
resolver = "3"
members = ["crates/flows-jj", "crates/smithers-ffi", "crates/smithers-machined"]

[workspace.dependencies]
# Both browser flows and the repository service use the same jj store format.
jj-lib = { path = "third_party/jj/lib", default-features = false }

# No debuginfo in dev builds: jj-lib's debuginfo multiplies the target dir
# several times over, and this workspace is exercised through tests, not
# debuggers.
[profile.dev]
debug = false

# The release profile tunes for the wasm32-wasip1 artifact that ships to the
# browser: small and predictable beats fast-to-compile.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "debuginfo"
