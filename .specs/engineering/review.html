<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Smithers MVP · engineering</title>
<style>
:root{
--bg:#f7f5f0;--paper:#fffdf9;--ink:#1d1b18;--ink2:#47423a;--muted:#6c655a;--line:#e4dfd5;--line2:#cfc8bb;
--accent:#a3401c;--warn:#b42318;--eng:#ebe6dc;--design:#e5e0f2;--design-ink:#433770;
--done:#2e7a4c;--prog:#b5780f;--open:#3a66a8;--nf:#cdc5b6;
--zone:#f0ece4;--zone2:#e9e4d9;--edge:#8c8478;
--amber-bg:#f5e7cb;--amber-ink:#73500d;--blue-bg:#e0e9f6;--blue-ink:#2b4f88;--neu-bg:#ebe7df;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
--bg:#161513;--paper:#1f1d1a;--ink:#ece7df;--ink2:#cbc4b8;--muted:#9c9488;--line:#302d28;--line2:#47423a;
--accent:#e8875d;--warn:#f2776c;--eng:#2a2723;--design:#2d2840;--design-ink:#cbc0f2;
--done:#5cb684;--prog:#e3a646;--open:#7da7e6;--nf:#4f4a42;
--zone:#1c1b18;--zone2:#24221e;--edge:#8a8377;
--amber-bg:#3a2e15;--amber-ink:#f0c877;--blue-bg:#1d2a3e;--blue-ink:#a8c5f2;--neu-bg:#2a2824;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1440px;margin:0 auto;padding:0 32px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:48px}
.brand{font:600 15px var(--serif);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:2px;margin-left:auto}
nav a{font-size:13px;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:999px;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);background:var(--eng)}
section{padding:44px 0 36px;scroll-margin-top:48px;border-top:1px solid var(--line)}
section.hero{border-top:0;padding:40px 0 34px}
h1{font:400 40px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
h1 span{color:var(--muted)}
h2{font:400 28px/1.2 var(--serif);margin:0 0 22px;display:flex;align-items:baseline;gap:12px}
h2 small{font:500 12px var(--mono);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 32px}
.commit{font:12px var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
.commit:hover,.docs a:hover{color:var(--ink);border-color:var(--ink2)}
.stats{display:flex;flex-wrap:wrap;gap:8px 36px;margin-top:26px}
.stat{text-decoration:none;display:flex;flex-direction:column}
.stat b{font:400 40px/1 var(--serif)}
.stat span{font-size:12px;color:var(--muted);margin-top:4px}
.stat:hover span{color:var(--ink)}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.docs a{font-size:13px;text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;color:var(--ink2)}
.ext::after{content:" ↗";color:var(--muted);font-size:.85em}
.nw{white-space:nowrap}
/* architecture */
.arch svg{display:block;width:100%;height:auto}
.zn-mac{fill:var(--zone);stroke:var(--line2)}
.zn-m,.zn-g{fill:var(--zone2);stroke:var(--line2);stroke-dasharray:5 4}
.zn-g{opacity:.7}
.zl rect{fill:var(--bg);stroke:var(--line2)}
.zl text{font:600 11px var(--sans);letter-spacing:.09em;fill:var(--muted)}
.node rect{fill:var(--paper);stroke:var(--line2)}
.node.outside rect{fill:var(--bg);stroke:var(--edge)}
.node .l{font:600 15px var(--sans);fill:var(--ink)}
.node .s{font:12.5px var(--sans);fill:var(--muted)}
.node:hover rect,.node.hot rect{stroke:var(--accent);stroke-width:1.5}
.node:focus{outline:none}
.node:focus-visible rect{stroke:var(--accent);stroke-width:3}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;stroke-linejoin:round}
#arw path{fill:var(--edge)}
#arw2 path{fill:var(--accent)}
.el rect{fill:var(--paper);stroke:var(--line)}
.el text{font:11.5px var(--sans);fill:var(--ink2)}
.arch.hl .edge,.arch.hl .el{opacity:.25}
.arch.hl .edge.hot{opacity:1;stroke:var(--accent);stroke-width:1.8}
.arch.hl .el.hot{opacity:1}
.alist{display:none}
.az{position:relative;border:1px solid var(--line2);border-radius:12px;padding:22px 10px 10px;background:var(--zone);margin:14px 0}
.az.m{border-style:dashed;background:var(--zone2);margin:12px 0 2px}
.az>.zt{position:absolute;top:-9px;left:12px;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:0 8px;font:600 10.5px/16px var(--sans);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ag a{display:block;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--paper);text-decoration:none;font-size:12px;color:var(--muted);line-height:1.35}
.ag a b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
/* plan */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--muted);margin:-6px 0 26px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:600;color:var(--ink2)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--eng);border:1px solid var(--line2)}
.sw.d{background:var(--design)}
.sw.t{background:transparent;border:1.5px solid var(--accent)}
.dash{display:inline-block;width:20px;border-top:1.5px dashed var(--warn)}
.bar{display:inline-block;width:4px;height:13px;border-radius:2px;background:var(--st)}
.plan{position:relative;display:grid;column-gap:16px;grid-template-rows:auto auto auto auto}
.stage,.dog{grid-row:span 4;display:grid;grid-template-rows:subgrid;min-width:0}
.rail{position:relative;height:18px}
.rail::before{content:"";position:absolute;left:0;right:-16px;top:8px;border-top:1.5px solid var(--line2)}
.stage:last-of-type .rail::before{right:0}
.rail i{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink2)}
.sh{display:block;text-decoration:none;padding:12px 0 14px}
.sh .id{font:400 30px/1 var(--serif)}
.sh .t{display:block;font-weight:600;font-size:15px;margin:6px 0 2px;line-height:1.3}
.sh .eta{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;font-size:13px;color:var(--ink2);margin-top:3px}
.sh .eta em{font-style:normal;color:var(--muted)}
.sh .g{display:block;font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}
.sh:hover .t{color:var(--accent)}
.conf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.conf i{display:inline-block;width:5px;height:11px;border-radius:1px;border:1px solid var(--ink2)}
.conf i.f{background:var(--ink2)}
.meta{padding-bottom:12px;display:flex;flex-direction:column;gap:8px}
.cnt{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--ink2)}
.cnt span{display:inline-flex;align-items:center;gap:4px}
.sbar{display:flex;flex:1;height:6px;border-radius:3px;overflow:hidden;background:var(--line);min-width:30px;gap:1px}
.sbar i{background:var(--st)}
.thin{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;font:11px var(--mono);color:var(--muted)}
.thin a{color:var(--accent);text-decoration:none;font-weight:600}
.thin a:hover{text-decoration:underline}
.thin em{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--accent);margin-right:4px}
.chips{display:grid;gap:4px;grid-template-columns:var(--cols,repeat(auto-fill,minmax(92px,1fr)));align-content:start}
.chips+.chips{margin-top:8px}
.chip{--st:var(--nf);position:relative;display:flex;align-items:center;gap:4px;height:22px;padding:0 4px 0 8px;border-radius:4px;background:var(--eng);font:500 10.5px/1 var(--mono);transition:opacity .12s}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px;background:var(--st)}
.chip.d{background:var(--design);color:var(--design-ink)}
.chip .i{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.chip .i::after{content:"";position:absolute;inset:0;border-radius:4px}
.chip .i:focus-visible{outline:none}
.chip .i:focus-visible::after{outline:2px solid var(--accent);outline-offset:1px}
.chip .z{font-size:9px;color:var(--muted)}
.chip .h{position:relative;z-index:1;width:10px;text-align:center;color:var(--muted);text-decoration:none;font-size:10px}
.chip a.h:hover{color:var(--accent)}
.chip.tp{box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.tp .i{color:var(--accent);font-weight:700}
.st-done{--st:var(--done)}.st-prog{--st:var(--prog)}.st-open{--st:var(--open)}.st-nf{--st:var(--nf)}
.hl .chip{opacity:.25}
.hl .chip.on,.hl .chip.dep,.hl .chip.rdep{opacity:1}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip.dep{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.chip.rdep{outline:1.5px dashed var(--ink2);outline-offset:-1.5px}
.late{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.late path{fill:none;stroke:var(--warn);stroke-width:1.4;stroke-dasharray:4 3;stroke-linejoin:round}
#lw path{fill:var(--warn);stroke:none}
.hl .late{opacity:.15}
.dog{position:relative}
.dog .rail b{position:absolute;left:12px;top:3px;width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.dog a{grid-row:2 / span 3;position:relative;display:block;text-decoration:none;writing-mode:vertical-rl;font-size:12px;color:var(--muted);padding:14px 0 0;margin-left:24px;line-height:1.25}
.dog a::before{content:"";position:absolute;left:-7px;top:0;bottom:0;border-left:1.5px dashed var(--accent)}
.dog a strong{color:var(--accent);font-weight:600}
.dog a:hover strong{text-decoration:underline}
/* forecast */
.fc,.chains{display:grid;grid-template-columns:minmax(200px,270px) minmax(0,1fr);gap:8px 28px;align-items:center}
.fl{font-size:12.5px;line-height:1.4;color:var(--muted)}
.fl b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink2)}
.fl.m b{font-weight:700;color:var(--ink)}
.fl.m b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.fl.cap{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.days{position:relative;display:flex;height:34px}
.days i{flex:1;border-left:1px solid var(--line);font:11px/1.25 var(--mono);font-style:normal;text-align:center;color:var(--muted)}
.days i.we{background:var(--zone)}
.days i:last-child{border-right:1px solid var(--line)}
.ax{height:auto}
.ax i{padding:3px 0;border-left-color:transparent}
.ax i:last-child{border-right-color:transparent}
.ax i.td{color:var(--accent);font-weight:600}
.days b{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:var(--c);border-radius:2px}
.days b::before{content:"";position:absolute;left:-6px;top:-4.5px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.days b::after{content:"";position:absolute;right:-1px;top:-5.5px;width:3px;height:14px;border-radius:1px;background:var(--c)}
.r-x{--c:var(--edge)}.r-today{--c:var(--prog)}.r-plan{--c:var(--ink)}
.chains{margin-top:30px;gap:12px 28px}
.cs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 5px;color:var(--muted);font-size:12px}
.cs .chip{width:92px}
.fnote{margin:26px 0 0;font-size:14px;color:var(--ink2)}
.fnote a{margin-left:8px;color:var(--accent);text-underline-offset:3px}
/* risks */
.risks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.risk{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-decoration:none}
.risk:hover{border-color:var(--ink2)}
.risk h3{margin:0;font:600 16px/1.35 var(--sans)}
.risk p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.pill{align-self:flex-start;font:600 11px/1 var(--sans);letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:var(--neu-bg);color:var(--ink2)}
.r-showing .pill{background:var(--amber-bg);color:var(--amber-ink)}
.r-spike .pill{background:var(--blue-bg);color:var(--blue-ink)}
.r-retired{background:transparent}
.r-retired h3{text-decoration:line-through;color:var(--muted);font-weight:500}
.r-retired .pill{background:transparent;border:1px solid var(--line2);color:var(--muted)}
/* for will */
.calm{display:flex;align-items:center;gap:22px;padding:40px 44px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.calm svg{flex:none}
.calm b{font:400 36px/1.1 var(--serif)}
.dec{display:grid;gap:10px}
.dec a{display:block;padding:18px 22px;border:1px solid var(--accent);border-radius:10px;background:var(--paper);text-decoration:none;font:400 20px/1.35 var(--serif)}
.fyi{margin-top:26px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.fyi>span{font:600 11px var(--sans);letter-spacing:.09em;color:var(--muted)}
.fyi a{font-size:14px;color:var(--ink2);text-decoration-color:var(--line2);text-underline-offset:3px}
.fyi a:hover{color:var(--ink);text-decoration-color:var(--ink2)}
#tip{position:fixed;z-index:30;max-width:340px;padding:10px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#tip .k{font:600 12px var(--mono)}
#tip .m{opacity:.75;font-size:11.5px;margin-top:5px}
#tip .m code{font:11px var(--mono)}
#tip .w{opacity:1;color:var(--bg);font-weight:600}
@media (max-width:900px){
.plan{display:block}
.stage{display:block;margin-bottom:26px}
.rail{display:none}
.sh{padding-top:0}
.dog{display:block;margin:0 0 26px}
.dog a{writing-mode:horizontal-tb;margin:0;padding:10px 0 10px 22px;border-top:1.5px dashed var(--accent);border-bottom:1.5px dashed var(--accent)}
.dog a::before{left:4px;top:50%;bottom:auto;width:9px;height:9px;margin-top:-5px;border:0;background:var(--accent);transform:rotate(45deg)}
.chips{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.fc,.chains{grid-template-columns:minmax(0,1fr);gap:6px}
.fl{margin-top:10px}
}
@media (max-width:760px){.arch svg{display:none}.alist{display:block}}
@media (max-width:600px){
.wrap{padding:0 16px}
.brand{display:none}
nav{margin:0 auto}
nav a{padding:5px 7px;font-size:12.5px}
h1{font-size:28px}
.stat b{font-size:32px}
.stats{gap:8px 26px}
.calm{padding:26px 22px;gap:16px}
.calm b{font-size:28px}
.calm svg{width:40px;height:40px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top">Smithers MVP</a>
  <nav aria-label="Sections"><a href="#arch">Architecture</a><a href="#plan">Plan</a><a href="#forecast">Forecast</a><a href="#risks">Risks</a><a href="#will">For Will</a></nav>
</div></header>
<main class="wrap">
  <section class="hero" id="top">
    <div class="row"><h1>Smithers MVP <span>·</span>&nbsp;engineering</h1><a class="commit" id="commit"></a></div>
    <div class="row"><div class="stats" id="stats"></div><div class="docs" id="docs"></div></div>
  </section>
  <section id="arch"><h2><small>01</small>Architecture</h2><div class="arch" id="archBox"></div></section>
  <section id="plan"><h2><small>02</small>Plan</h2><div class="legend" id="legend"></div><div class="plan hlz" id="planGrid"></div></section>
  <section id="forecast"><h2><small>03</small>Stage 1 forecast</h2><div id="fcBox"></div></section>
  <section id="risks"><h2><small>04</small>Risks</h2><div class="risks" id="riskGrid"></div></section>
  <section id="will"><h2><small>05</small>For Will</h2><div id="willBox"></div></section>
</main>

let h = forWill.length
? '<div class="dec">' + forWill.map(d => { const t = typeof d === 'string' ? d : (d.text || d.title || ''); return d.href ? ext(d.href, '', esc(t)) : `<a>${esc(t)}</a>`; }).join('') + '</div>'
: '<div class="calm"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="var(--done)" stroke-width="2"/><path d="M15 27 l7 7 l15 -16" fill="none" stroke="var(--done)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Nothing to decide</b></div>';
if (fyi.length) h += '<div class="fyi"><span>FYI</span>' + fyi.map(f => ext(f.href, 'ext', esc(f.text))).join('') + '</div>';
$('#willBox').innerHTML = h;
}

/* nav state */
if ('IntersectionObserver' in window) {
const links = {}; $$('nav a').forEach(a => { links[a.getAttribute('href').slice(1)] = a; });
const io = new IntersectionObserver(es => es.forEach(e => {
if (e.isIntersecting) Object.keys(links).forEach(k => links[k].classList.toggle('on', k === e.target.id));
}), {rootMargin: '-45% 0px -50% 0px'});
Object.keys(links).forEach(k => { const s = document.getElementById(k); if (s) io.observe(s); });
}
})();
</script>
</body>
</html>
