      - name: Build all workspaces from clean artifacts
        if: env.CANDIDATE_RUN_ID == ''
        run: node scripts/build-release.mjs
      - name: Review declaration API drift
        if: env.CANDIDATE_RUN_ID == ''
        run: node scripts/check-api-baseline.mjs
      - name: Retrieve native helpers for npm
        if: env.CANDIDATE_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/smithers-native/linux-x64"
          install -m 0755 "$RUNNER_TEMP/smithers-native/smithers-jj-export" "$RUNNER_TEMP/smithers-native/linux-x64/smithers-jj-export"
          for platform in darwin-arm64 darwin-x64 linux-arm64 win32-x64; do
            mkdir -p "$RUNNER_TEMP/smithers-native/$platform"
            gh run download "$GITHUB_RUN_ID" --name "native-helper-$platform" --dir "$RUNNER_TEMP/smithers-native/$platform"
            binary=smithers-jj-export
            case "$platform" in win32-*) binary="$binary.exe";; esac
            chmod 0755 "$RUNNER_TEMP/smithers-native/$platform/$binary"
          done
        shell: bash
      # Pack from staging manifests whose exports point at built artifacts.
      # Repository manifests retain Effect's source-first export shape.
      # Pack and smoke on the supported Node floor. The server step above
      # selects the repository's pinned release, so reinstall the floor and its
      # certified npm here rather than trust whichever Node ran last.
      - name: Install the supported Node floor
        if: env.CANDIDATE_RUN_ID == ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
          registry-url: https://registry.npmjs.org
      - name: Install certified npm for the Node floor
        if: env.CANDIDATE_RUN_ID == ''
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: bash
      - name: Pack and smoke-test release artifacts
        if: env.CANDIDATE_RUN_ID == ''
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/release-smoke-evidence
          SMITHERS_NATIVE_HELPERS_DIR: ${{ runner.temp }}/smithers-native
        run: |
          test "$(node --version)" = 'v26.4.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p "$SMOKE_EVIDENCE_DIR"
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"
          cp "$PACK_DIR/smoke-evidence.json" "$SMOKE_EVIDENCE_DIR/node26.json"
      - name: Restore and verify archived release candidate
        if: env.CANDIDATE_RUN_ID != ''
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-release.mjs "$PACK_DIR"
      # The package set and its order come from scripts/pack-release.mjs, which
      # derives membership from the `engine` and `agent` smthrs.group values
      # and order from the workspace dependency edges. Reading manifest.json
      # publishes exactly what the pack step produced, in the packed order, so
      # the lists cannot drift or accidentally include a private package.
      #
      # The plan is computed on both paths, so a dry run reports the exact set,
      # order, version, and dist-tag a real run would publish.
      - name: Archive tested release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs
          if-no-files-found: error
          retention-days: 30
      - name: Collect ci-test-tier-evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-test-tier-evidence"
          for f in '/tmp/smithers-ci-inventory-'*'.json'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-mutations-'*''; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-benchmark-'*''; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-runner-'*'.log'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-runner-'*'.json'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
      - name: Upload ci-test-tier-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-test-tier-evidence
          path: "${{ runner.temp }}/ci-test-tier-evidence"
          if-no-files-found: ignore
      - name: Upload release runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-smoke-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-smoke-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Compute the publish plan
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          release_version="${RELEASE_TAG#v}"
          # A prerelease never takes `latest`: `npm install smthrs` and every
          # range that tracks the tag must keep resolving 0.35.0 until 1.0.0 is
          # final. Prereleases publish under `next`, which is also pinned in each
          # manifest's publishConfig.tag (the release runbook in Smithers-Ops).
          publish_tag="latest"
          case "$release_version" in *-*) publish_tag="next" ;; esac
          node -e '
            const { readFileSync } = require("node:fs")
            const packed = JSON.parse(readFileSync(process.env.PACK_DIR + "/manifest.json", "utf8"))
            for (const entry of packed) console.log(entry.name + " " + entry.filename)
          ' > "$PUBLISH_ORDER"
          echo "PUBLISH_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PUBLISH_DIST_TAG=$publish_tag" >> "$GITHUB_ENV"
          echo "Publish plan for $release_version on the $publish_tag dist-tag:"
          cat "$PUBLISH_ORDER"
      - name: Publish packages in dependency order
        if: env.DRY_RUN != 'true' && !inputs.sourceRef
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
          # Trusted publishing (id-token: write) is the primary credential and
          # needs nothing here. First publication of a new package name needs
          # the repository token because npm cannot preconfigure trusted
          # publishing for a name that does not exist yet. The token remains a
          # fallback for existing names, and provenance stays enabled below.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-release.mjs "$PACK_DIR"
      # publish-release.mjs rewrites publish-receipt.json after every package
      # it publishes. The candidate archive above predates publication, so a
      # train that stops halfway would otherwise leave the only record of
      # which names landed on the runner's disk.
      - name: Upload the publish receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-publish-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs/publish-receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Report the skipped publication
        if: env.DRY_RUN == 'true'
        env:
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          echo "Dry run: every current gate ran; candidate build/smoke or archived-candidate verification passed. Nothing was published."
          echo "A real run would publish these at $PUBLISH_VERSION on the $PUBLISH_DIST_TAG dist-tag:"
          cat "$PUBLISH_ORDER"
  distribution-publish:
    name: publish public multi-architecture image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sourceRef != '' && inputs.sourceRef || inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      - name: Enable image architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up multi-architecture image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify distribution version
        run: node --test scripts/repo-contract/distribution-image-tag.test.mjs
      - name: Rehearse both image architectures
        if: env.DRY_RUN == 'true'
        run: bash distribution/publish-image.sh "${RELEASE_TAG#v}" "$(git rev-parse HEAD)" --dry-run
      - name: Publish and anonymously verify distribution image
        if: env.DRY_RUN != 'true' && !inputs.sourceRef
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash distribution/publish-image.sh "${RELEASE_TAG#v}" "$(git rev-parse HEAD)"
  # The docs sites serve the release that just published. A dispatched run is a
  # rehearsal and deploys nothing. Alchemy reads the shared alchemy-state-store,
  # so this job plans against the same record as an operator's shell.
  docs-deploy:
    name: deploy package docs sites
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    timeout-minutes: 60
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
    steps:
      - name: Require deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Repository secret CLOUDFLARE_API_TOKEN is not set." >&2; exit 1; }
          test -n "$ALCHEMY_PASSWORD" || { echo "Repository secret ALCHEMY_PASSWORD is not set." >&2; exit 1; }
        shell: bash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Flags go straight after the script name: pnpm forwards a literal `--`,
      # and Alchemy reads anything after it as the main file.
      - name: Deploy every docs site
        run: pnpm docs:deploy --yes

  installer-archive:
    name: installed npm CLI (${{ matrix.platform }})
    needs: publish
    # A sourceRef rehearsal has no release tag and cannot earn a tag receipt.
    if: inputs.sourceRef == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs
      - name: Install CLI consumer tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0,ripgrep@14.1.1
      - name: Build and execute relocated installer
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          INSTALLER_DIR: ${{ runner.temp }}/installer
        run: |
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.PACK_DIR + "/release-manifest.json")).source.sha')" = "$(git rev-parse HEAD)"
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          node scripts/installer-release.mjs pack "$PACK_DIR" "$RELEASE_TAG" "$INSTALLER_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ runner.temp }}/installer
          if-no-files-found: error
          retention-days: 30
  installer-publish:
    name: sign and publish installer archives
    needs: installer-archive
    if: github.event_name != 'workflow_dispatch' || !inputs.dryRun
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: installer-publish
    concurrency:
      group: installer-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
    steps:
      - name: Require the exact tag-bound signing identity
        run: |
          test "$GITHUB_REPOSITORY" = smithersai/smithers
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_WORKFLOW_REF" = "smithersai/smithers/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs
      - name: Install trusted Cosign v3
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0, embedded checksums
        with:
          cosign-release: v3.0.2
      - name: Sign and self-verify the complete archive set
        env:
          INSTALLER_DIR: ${{ runner.temp }}/installer
          PACK_DIR: ${{ runner.temp }}/release-packs
        run: |
          INSTALLER_CANDIDATE_INTEGRITY="$(node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { candidateIntegrity, verifyLocalCandidate } from "./scripts/publish-release.mjs";
            const candidate = JSON.parse(await readFile(process.env.PACK_DIR + "/release-manifest.json", "utf8"));
            await verifyLocalCandidate(process.env.PACK_DIR, candidate);
            console.log(candidateIntegrity(candidate));
          ')"
          export INSTALLER_CANDIDATE_INTEGRITY
          INSTALLER_SOURCE_SHA="$(git rev-parse HEAD)"
          export INSTALLER_SOURCE_SHA
          node scripts/installer-release.mjs sign "$INSTALLER_DIR" "$RELEASE_TAG"
      - name: Retain signed installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-installer-${{ github.run_id }}
          path: ${{ runner.temp }}/installer
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified archives and update latest last
        env:
          INSTALLER_DIR: ${{ runner.temp }}/installer
          # Configure only after Plue #702 supports atomic directory installs.
          INSTALLER_FORMAT: ${{ vars.SMITHERS_INSTALLER_FORMAT }}
          INSTALLER_BUCKET: ${{ vars.SMITHERS_INSTALLER_BUCKET }}
          INSTALLER_S3_ENDPOINT: ${{ vars.SMITHERS_INSTALLER_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SMITHERS_INSTALLER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SMITHERS_INSTALLER_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          test "$INSTALLER_FORMAT" = npm-directory-v1
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          node scripts/installer-release.mjs publish "$INSTALLER_DIR" "$RELEASE_TAG"
