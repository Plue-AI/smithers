name: Release

on:
  push:
    tags:
      - "v*"
  # Rehearsal path. A dispatched run executes every gate, packs the release set,
  # smoke-tests the tarballs, and skips publication while dryRun is true. npm
  # versions are immutable, so this is the only way to exercise the workflow
  # end to end without spending the version under test.
  workflow_dispatch:
    inputs:
      releaseTag:
        description: "Tag to validate, for example v1.0.0-rc.0; with sourceRef, the intended version label. Defaults to the dispatched ref."
        type: string
        required: false
        default: ""
      sourceRef:
        description: "Optional full commit SHA on main for a fresh dry run. Requires dryRun=true and no archived candidate IDs."
        type: string
        required: false
        default: ""
      dryRun:
        description: "Run every gate and skip the npm publish step."
        type: boolean
        required: false
        default: true
      candidateRunId:
        description: "Restore a tested candidate from this completed Release run; set candidateArtifactId too."
        type: string
        required: false
        default: ""
      candidateArtifactId:
        description: "Immutable release-candidate artifact ID from candidateRunId; empty builds a new candidate."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
  cancel-in-progress: false

jobs:
  native-helper:
    name: native helper (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sourceRef != '' && inputs.sourceRef || inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - name: Build helper
        run: |
          rustup toolchain install '1.98.0' --profile minimal
          cargo +1.98.0 build --locked --release -p smithers-ffi --bin smithers-jj-export
          mkdir -p "$RUNNER_TEMP/native-helper"
          binary=smithers-jj-export
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          install -m 0755 "target/release/$binary" "$RUNNER_TEMP/native-helper/$binary"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-helper-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-helper/*
  native-mode-matrix:
    name: packaged native topology and persistence
    needs: native-helper
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Require Plue matrix target
        env:
          SMITHERS_MODE_MATRIX_PLUE_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_URL }}
          SMITHERS_MODE_MATRIX_PLUE_TOKEN: ${{ secrets.SMITHERS_MODE_MATRIX_PLUE_TOKEN }}
        run: |
          test -n "$SMITHERS_MODE_MATRIX_PLUE_URL" || { echo 'SMITHERS_MODE_MATRIX_PLUE_URL is required for release' >&2; exit 1; }
          test -n "$SMITHERS_MODE_MATRIX_PLUE_TOKEN" || { echo 'SMITHERS_MODE_MATRIX_PLUE_TOKEN is required for release' >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sourceRef != '' && inputs.sourceRef || inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-helper-linux-arm64
          path: ${{ runner.temp }}/linux-arm64-helper
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.8
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - run: brew install postgresql@18
      - run: pnpm --filter smithers-app exec playwright install chromium
      - name: Build packaged native app
        env:
          SMITHERS_NATIVE_E2E_CEF: "1"
          SMITHERS_NATIVE_E2E_CDP_PORT: "9444"
          SMITHERS_LINUX_ARM64_JJ_EXPORT_BINARY: ${{ runner.temp }}/linux-arm64-helper/smithers-jj-export
        run: SMITHERS_BUILD_SHA="$(git rev-parse HEAD)" SMITHERS_POSTGRES_BUNDLE_DIR="$(brew --prefix postgresql@18)" bun apps/app/scripts/build-native.ts
      - name: Prove native owned and Plue process topology
        env:
          SMITHERS_MODE_MATRIX_PLUE_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_URL }}
          SMITHERS_MODE_MATRIX_PLUE_TOKEN: ${{ secrets.SMITHERS_MODE_MATRIX_PLUE_TOKEN }}
        run: |
          executable=$(find apps/app -path '*/Smithers.app/Contents/MacOS/launcher' -type f -print -quit)
          test -n "$executable"
          SMITHERS_BUILD_SHA="$(git rev-parse HEAD)" bun apps/app/scripts/test-native-owned.ts "$executable"
      - name: Prove native matrix launcher and capabilities
        env:
          SMITHERS_MODE_MATRIX_NATIVE_CDP_ENDPOINT: http://127.0.0.1:9444
          SMITHERS_MODE_MATRIX_PLUE_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_URL }}
          SMITHERS_MODE_MATRIX_PLUE_TOKEN: ${{ secrets.SMITHERS_MODE_MATRIX_PLUE_TOKEN }}
        run: |
          executable=$(find apps/app -path '*/Smithers.app/Contents/MacOS/launcher' -type f -print -quit)
          test -n "$executable"
          SMITHERS_BUILD_SHA="$(git rev-parse HEAD)" bun apps/app/scripts/test-native-mode-matrix.ts "$executable"
      - name: Product native modes
        env:
          SMITHERS_MODE_MATRIX_NATIVE_CDP_ENDPOINT: http://127.0.0.1:9444
          SMITHERS_MODE_MATRIX_PLUE_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_URL }}
          SMITHERS_MODE_MATRIX_PLUE_TOKEN: ${{ secrets.SMITHERS_MODE_MATRIX_PLUE_TOKEN }}
          SMITHERS_MODE_MATRIX_OUTPUT_DIR: ${{ runner.temp }}/smithers-native-matrix
        run: |
          executable=$(find apps/app -path '*/Smithers.app/Contents/MacOS/launcher' -type f -print -quit)
          test -n "$executable"
          SMITHERS_BUILD_SHA="$(git rev-parse HEAD)" bun apps/app/scripts/run-packaged-native-mode-matrix.ts "$executable"
      - name: Upload native mode receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-native-mode-matrix
          path: ${{ runner.temp }}/smithers-native-matrix
  publish:
    name: validate, build, and publish
    runs-on: ubuntu-latest
    needs: native-helper
    # npm libraries have their own source, package, and installed-consumer gates.
    # Keep the private app's native matrix visible without blocking that train.
    timeout-minutes: 180
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # A tag push releases the tag it pushed. A dispatched run releases the tag
      # it was given, because github.ref_name is a branch name on that path.
      # With sourceRef, this is only the intended version label for a dry run.
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
      # Publication is skipped only on a dispatched dry run. A tag push always
      # publishes: `inputs.dryRun` is absent there, so this resolves to false.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      CANDIDATE_RUN_ID: ${{ inputs.candidateRunId }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidateArtifactId }}
    steps:
      # A re-run replays every gate, rebuilds and repacks a candidate, and then
      # fails at the archive step: actions/upload-artifact refuses a second
      # `release-candidate-<run-id>` inside one run. The retry that works is a
      # new dispatch that restores the archived candidate (scripts/release-resume.md),
      # so a re-run attempt is refused before the first gate spends an hour.
      - name: Refuse a re-run attempt
        if: github.run_attempt != '1'
        run: |
          echo "Run attempt $GITHUB_RUN_ATTEMPT would rebuild the candidate and then collide with this run's release-candidate-$GITHUB_RUN_ID artifact." >&2
          echo "Dispatch Release again with releaseTag=$RELEASE_TAG instead. To resume the archived candidate, pass candidateRunId=$GITHUB_RUN_ID and candidateArtifactId=<the release-candidate-$GITHUB_RUN_ID artifact ID> (scripts/release-resume.md)." >&2
          exit 1
      - name: Require Plue matrix target
        env:
          SMITHERS_MODE_MATRIX_PLUE_WEB_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_WEB_URL }}
          SMITHERS_MODE_MATRIX_PLUE_URL: ${{ vars.SMITHERS_MODE_MATRIX_PLUE_URL }}
          SMITHERS_MODE_MATRIX_PLUE_TOKEN: ${{ secrets.SMITHERS_MODE_MATRIX_PLUE_TOKEN }}
        run: |
          test -n "$SMITHERS_MODE_MATRIX_PLUE_WEB_URL" || { echo 'SMITHERS_MODE_MATRIX_PLUE_WEB_URL is required for release' >&2; exit 1; }
          test -n "$SMITHERS_MODE_MATRIX_PLUE_URL" || { echo 'SMITHERS_MODE_MATRIX_PLUE_URL is required for release' >&2; exit 1; }
          test -n "$SMITHERS_MODE_MATRIX_PLUE_TOKEN" || { echo 'SMITHERS_MODE_MATRIX_PLUE_TOKEN is required for release' >&2; exit 1; }
      # This guard is inline so the workflow can validate an older source SHA
      # that does not contain a newly added release helper.
      - name: Validate explicit dry-run source
        run: |
          if [ -z "$SOURCE_REF" ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$DRY_RUN" != true ] \
            || [ -n "$CANDIDATE_RUN_ID" ] || [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
            echo "sourceRef is allowed only for a fresh workflow_dispatch dry run without archived candidate IDs." >&2
            exit 1
          fi
          if ! [[ "$SOURCE_REF" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "sourceRef must be a full 40- or 64-character hexadecimal commit SHA." >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "An explicit sourceRef requires releaseTag in v<version> format as the intended version label." >&2; exit 1 ;;
          esac
        shell: bash
      # Full history and tags. The changelog gate below reads the commit range
      # from the previous v* tag to the tag being released, and the default
      # shallow checkout carries neither the tags nor the commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.sourceRef != '' && inputs.sourceRef || inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - name: Verify explicit dry-run source
        run: |
          if [ -z "$SOURCE_REF" ]; then exit 0; fi
          actual_source="$(git rev-parse --verify HEAD)"
          requested_source="$(printf '%s' "$SOURCE_REF" | tr 'A-F' 'a-f')"
          if [ "$actual_source" != "$requested_source" ]; then
            echo "The checked-out source does not match sourceRef." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_source" refs/remotes/origin/main; then
            echo "sourceRef must be reachable from origin/main." >&2
            exit 1
          fi
        shell: bash
      # actionlint models GitHub's per-key expression-context rules, including
      # the fact that `runner` is available to steps but not a job-level env.
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
        with:
          args: ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-auth.yml .github/workflows/apps-deploy.yml .github/workflows/distribution.yml .github/workflows/canary.yml .github/workflows/pr-review.yml .github/workflows/review.yml .github/workflows/reliability.yml .github/workflows/native-windows.yml .github/workflows/mirror-sync.yml .github/workflows/drift.yml"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.8
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Enable the containerd image store
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ] \
            && [ "$(docker info --format '{{.Driver}}' 2>/dev/null)" != overlayfs ]; then
            if [ -f /etc/docker/daemon.json ]; then
              merged="$(jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json)"
            else
              merged='{ "features": { "containerd-snapshotter": true } }'
            fi
            printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info --format 'docker storage driver: {{.Driver}}'
          fi
        shell: bash
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install certified npm
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: bash
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native smithers-jj-export
        run: |
          case "$(uname -s)" in Linux|Darwin|MINGW*|MSYS*)
            native_suffix=''
            case "$(uname -s)" in MINGW*|MSYS*) native_suffix='.exe';; esac
            rustup toolchain install '1.98.0' --profile minimal
            cargo +1.98.0 build --locked -p 'smithers-ffi' --bin 'smithers-jj-export'
            mkdir -p "$RUNNER_TEMP/smithers-native"
            native_path="$RUNNER_TEMP/smithers-native/smithers-jj-export$native_suffix"
            install -m 755 "target/debug/smithers-jj-export$native_suffix" "$native_path"
            if [ "$native_suffix" = '.exe' ]; then native_path="$(cygpath -w "$native_path")"; fi
            printf '%s=%s\n' 'SMITHERS_WORKSPACE_JJ_EXPORT_BINARY' "$native_path" >> "$GITHUB_ENV"
          esac
        shell: bash
      - name: Validate archived candidate selection
        run: node scripts/restore-release.mjs --check-inputs
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tags must use the v<version> format." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          # Smithers 1.0 gives every public first-party package one
          # synchronized version, so the engine and agent groups release
          # together. Tooling is private and never packed. A private manifest
          # is still group-checked, so a package cannot leave the train by
          # dropping its group.
          # The member list comes from `pnpm-workspace.yaml` through the one
          # reader every gate shares, never from a shell glob. Packages nest —
          # a granular package lives inside the product package it belongs to,
          # three directory levels deep — and a glob deep enough to reach one
          # also matches the generated `dist/cjs/package.json` a built package
          # ships, which carries no group and would fail this loop on a build
          # artifact. No package is named here: the published set is the pack
          # manifest, and this loop only checks what the workspace declares.
          for directory in $(node scripts/workspace-packages.mjs --library-dirs); do
            manifest="$directory/package.json"
            package_group="$(node -p "require('./' + process.argv[1]).smthrs?.group ?? ''" "$manifest")"
            case "$package_group" in
              engine|agent) ;;
              tooling) continue ;;
              *) echo "$manifest has missing or unknown smthrs.group '$package_group'." >&2; exit 1 ;;
            esac
            package_private="$(node -p "String(require('./' + process.argv[1]).private === true)" "$manifest")"
            if [ "$package_private" = "true" ]; then continue; fi
            package_version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$manifest has version $package_version; expected $RELEASE_VERSION." >&2
              exit 1
            fi
          done
          # Tooling is private and never packed, but it pins the same version
          # and the workspace: ranges the packed manifests resolve through, so
          # the checker covers every versioned manifest and source, not only
          # the two published groups the loop above reads.
          node scripts/set-release-version.mjs --check "$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      # The changelog is generated from the commit range, so a release whose
      # section is missing or stale is a release nobody wrote up. Failing here
      # costs a re-tag; failing after the publish step costs an immutable npm
      # version whose changelog says nothing about it.
      - name: Release changelog section
        run: node scripts/generate-changelog.mjs --check --version "$RELEASE_VERSION"
      - name: Install jj
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: ripgrep@14.1.1
      - name: Install filesystem helper for sandboxed package tests
        run: sudo install -m 0755 "$RUNNER_TEMP/smithers-native/smithers-jj-export" /usr/local/bin/smithers-jj-export
        shell: bash
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: bash
      - name: Install PostgreSQL
        id: setup
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-common
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
              echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
              sudo apt-get install -y -qq --no-install-recommends 'postgresql-18'
              pg_bin=/usr/lib/postgresql/18/bin path_entry="$pg_bin" floor=18
              ;;
            Darwin)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet 'postgresql@18'
              pg_bin="$(brew --prefix 'postgresql@18')/bin" path_entry="$pg_bin" floor=18
              ;;
            MINGW*|MSYS*)
              pg_bin="$(cygpath -u "${PGBIN:?the runner image names no PostgreSQL in PGBIN}")" path_entry="$PGBIN" floor=17
              ;;
            *) echo "no PostgreSQL install for $(uname -s)" >&2; exit 1 ;;
          esac
          version="$("$pg_bin/initdb" --version)"
          major="${version#*) }"
          major="${major%%[!0-9]*}"
          if [ -z "$major" ] || [ "$major" -lt "$floor" ]; then
            echo "$version is not PostgreSQL $floor or later" >&2
            exit 1
          fi
          echo "$version"
          printf '%s\n' "$path_entry" >> "$GITHUB_PATH"
        shell: bash
      # The gate roster below is the required CI `test` job, copied verbatim
      # from the generated .github/workflows/ci.yml, plus the fault matrix the
      # required `e2e-faults` job runs. A release that drove the recursive
      # per-package scripts instead proved a different thing than CI proves,
      # and drifted: those runners need none of the toolchain above, so the
      # 1.0.0-rc.0 dry run reached the std package's ripgrep conformance suite
      # on a runner with no rg binary and failed 25 cases. pack-release.test.mjs
      # compares these blocks against ci.yml, so the copy cannot go stale in
      # silence, and the toolchain block above is a one-line copy per bump.
      - name: Examples
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs ci '//examples/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Workspace targets
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs ci '//packages/...' --jobs 2 --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Script gates
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs test '//scripts/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Repository flows
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs test '//flows:pack' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Judge egress
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs test '//flows:egress' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Repository flow fixtures
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs test '//flows:repository' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Wiki and release fixtures
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs test '//flows:fixtures' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Repository flows lint
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: pnpm exec smthrs lint '//flows/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
