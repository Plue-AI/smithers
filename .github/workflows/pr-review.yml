name: smithers review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: smithers-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # The job holds the review identity and PR write, so it runs main's
  # reusable review workflow by name: the service accepts only its token.
  review:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: smithersai/smithers/.github/workflows/review.yml@main
