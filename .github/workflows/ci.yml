          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "SWE-bench rig typecheck"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs build '//evals/swebench:check' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "SWE-bench rig lint"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs lint '//evals/swebench/...' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Server typecheck and tests"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
