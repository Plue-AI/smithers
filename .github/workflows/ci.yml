          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Wiki and release fixtures"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs test '//flows:fixtures' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Repository flows lint"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs lint '//flows/...' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Public export JSDoc"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs lint '//:jsdocTree' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Script lint"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs lint '//scripts:lint' --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
