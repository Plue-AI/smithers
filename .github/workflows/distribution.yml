name: Distribution image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  # Finish the active image acceptance; newer pushes replace only pending work.
  cancel-in-progress: false

jobs:
  image:
    name: preview image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.4.0
      - name: Test preview image
        env:
          SMITHERS_BUILD_SHA: ${{ github.sha }}
        run: bash distribution/test-preview.sh smithers-preview:ci
