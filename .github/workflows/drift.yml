name: "Drift"
on:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  trusted-drift:
    uses: "smithersai/smithers/.github/workflows/trusted-drift.yml@f3b545d668460585672b7d248349876b5ce0cddc"
  drift:
    name: "Per-commit drift"
    needs: trusted-drift
    if: ${{ always() }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Trusted drift result"
        run: "test '${{ needs.trusted-drift.result }}' = 'success'"
        shell: "bash"
