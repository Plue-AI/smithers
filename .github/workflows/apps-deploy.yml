name: "Deploy apps"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  "gate":
    name: "apps gates"
    runs-on: "ubuntu-latest"
    timeout-minutes: 75
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - uses: "pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86"
      - uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          "node-version-file": ".node-version"
          "cache": "pnpm"
      - name: "Install certified npm"
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: "bash"
      - uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          "bun-version": "1.4.1"
      - run: "pnpm install --frozen-lockfile --ignore-scripts"
      - uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
      - name: "Install native smithers-jj-export"
        run: |
          case "$(uname -s)" in Linux|Darwin|MINGW*|MSYS*)
            native_suffix=''
            case "$(uname -s)" in MINGW*|MSYS*) native_suffix='.exe';; esac
            rustup toolchain install '1.98.0' --profile minimal
            cargo +1.98.0 build --locked -p 'smithers-ffi' --bin 'smithers-jj-export'
            mkdir -p "$RUNNER_TEMP/smithers-native"
            native_path="$RUNNER_TEMP/smithers-native/smithers-jj-export$native_suffix"
            install -m 755 "target/debug/smithers-jj-export$native_suffix" "$native_path"
            if [ "$native_suffix" = '.exe' ]; then native_path="$(cygpath -w "$native_path")"; fi
            printf '%s=%s\n' 'SMITHERS_WORKSPACE_JJ_EXPORT_BINARY' "$native_path" >> "$GITHUB_ENV"
          esac
        shell: "bash"
      - name: "Install jj"
        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "jj-cli@0.39.0"
      - name: "Initialize colocated jj repository"
        run: "jj git init --colocate"
      - name: "Install ripgrep"
        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "ripgrep@14.1.1"
      - name: "Install system packages"
        id: setup
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: "bash"
      - name: "UI typecheck"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs build '//apps/app:check' --verbose"
      - name: "UI unit tests"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs test '//apps/app:unitTests' --verbose"
      - name: "UI conformance lint"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs test '//apps/app:conformance' --verbose"
      - name: "UI browser end-to-end suite"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs test '//apps/app:browserE2e' --verbose"
      - name: "Server typecheck and tests"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs ci '//apps/server/...' --verbose"
      - name: "Site build and tests"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs ci '//apps/site/...' --verbose"
      - name: "Collect apps-deploy-e2e-artifacts"
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/apps-deploy-e2e-artifacts"
          for f in '/tmp/smithers-'*'.png'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/apps-deploy-e2e-artifacts"; fi; done
          if [ -e 'apps/reports' ]; then cp -R -- 'apps/reports' "$RUNNER_TEMP/apps-deploy-e2e-artifacts/reports"; fi
          if [ -e 'apps/app/test-results' ]; then cp -R -- 'apps/app/test-results' "$RUNNER_TEMP/apps-deploy-e2e-artifacts/playwright-test-results"; fi
          if [ -e 'apps/app/playwright-report' ]; then cp -R -- 'apps/app/playwright-report' "$RUNNER_TEMP/apps-deploy-e2e-artifacts/playwright-report"; fi
      - name: "Upload apps-deploy-e2e-artifacts"
        if: always()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          "name": "apps-deploy-e2e-artifacts"
          "path": "${{ runner.temp }}/apps-deploy-e2e-artifacts"
          "if-no-files-found": "ignore"
  "deploy":
    name: "build + wrangler deploy"
    runs-on: "ubuntu-latest"
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: "production"
    needs: ["gate"]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          "fetch-depth": "0"
      - uses: "pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86"
      - uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          "node-version-file": ".node-version"
          "cache": "pnpm"
      - name: "Install certified npm"
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: "bash"
      - uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          "bun-version": "1.4.1"
      - id: setup
        run: "pnpm install --frozen-lockfile --ignore-scripts"
      - name: "Deploy"
        run: "pnpm exec smthrs run '//apps/server:deploy' --outward-only --verbose"
        env:
          "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
      - name: "Collect deploy-receipt"
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-receipt"
          if [ -e 'apps/server/deploy-receipts/.' ]; then cp -R -- 'apps/server/deploy-receipts/.' "$RUNNER_TEMP/deploy-receipt"; fi
      - name: "Upload deploy-receipt"
        if: always()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          "name": "deploy-receipt"
          "path": "${{ runner.temp }}/deploy-receipt"
          "if-no-files-found": "ignore"
