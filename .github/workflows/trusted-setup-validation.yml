name: Trusted setup validation
on:
  push:
    branches: [main]
    paths:
      - .github/actions/trusted-ci-setup/**
      - .github/actions/trusted-ci-setup-campaign/**
      - .github/workflows/trusted-setup-validation.yml
      - scripts/ci/drift-job.test.mjs
      - packages/smithers/build/targets/src/GithubCiGen.ts
      - PACKAGE.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusted-setup-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  setup:
    name: Root setup input validation
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Main-pinned setup campaign
        uses: smithersai/smithers/.github/actions/trusted-ci-setup-campaign@f3b545d668460585672b7d248349876b5ce0cddc
      - name: Setup receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-ci-setup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smithers-setup-campaign/
          if-no-files-found: error
