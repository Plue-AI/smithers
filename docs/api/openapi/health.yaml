paths:
  /api/host:
    patch:
      summary: Lower the install machine capacity
      operationId: patch_api_host
      tags:
        - Health
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      description: Requires the install owner and write:user scope. Does not stop held machines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capacity]
              properties:
                capacity: {type: integer, minimum: 1}
      responses:
        '200':
          description: Updated host status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyJSON'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Host status unavailable
    get:
      summary: Read detected host resources and machine limits
      operationId: get_api_host
      tags:
        - Health
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      description: Requires read:user scope for tokens. Capacity is clamped to the detected host on every read.
      responses:
        '200':
          description: Detected profile, formula limits and effective capacity.
          content:
            application/json:
              schema:
                type: object
                required: [profile, limits, machines]
                properties:
                  profile:
                    type: object
                    required: [memory_bytes, perf_cores, physical_cores, disk_free_bytes, macos_version, hypervisor]
                    properties:
                      memory_bytes: {type: integer, format: int64, minimum: 0}
                      perf_cores: {type: integer, minimum: 0}
                      physical_cores: {type: integer, minimum: 0}
                      disk_free_bytes: {type: integer, format: int64, minimum: 0}
                      macos_version: {type: string}
                      hypervisor: {type: boolean}
                  limits:
                    type: object
                    required: [memory_mib, cpus, capacity, layer_budget_bytes, memory_capacity, core_capacity, disk_capacity, limiting_term]
                    properties:
                      memory_mib: {type: integer, minimum: 1}
                      cpus: {type: integer, minimum: 2, maximum: 4}
                      capacity: {type: integer, minimum: 0}
                      layer_budget_bytes: {type: integer, format: int64, minimum: 0}
                      memory_capacity: {type: integer, minimum: 0}
                      core_capacity: {type: integer, minimum: 0}
                      disk_capacity: {type: integer, minimum: 0}
                      limiting_term: {type: string, enum: [memory, cores, disk]}
                      missing:
                        type: integer
                        format: int64
                        minimum: 0
                        description: Bytes for memory or disk; cores for the cores term. Present at capacity zero.
                      fix: {type: string}
                  machines:
                    type: object
                    required: [in_use, capacity]
                    properties:
                      in_use: {type: integer, minimum: 0}
                      capacity: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Host status persistence is unavailable or invalid.
          content:
            application/json:
              schema:
                type: object
                required: [code, class, message]
                properties:
                  code: {type: string, const: host_status_unavailable}
                  class: {type: string, const: infra}
                  message: {type: string, const: host status unavailable}
  /api/status:
    get:
      summary: Read public canary status
      operationId: get_api_status
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Canary evidence; missing, stale, invalid, or unreadable runs report unknown.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status, checked_at, components]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  checked_at:
                    type: string
                    format: date-time
                  components:
                    type: object
                    required: [canary]
                    properties:
                      canary:
                        type: object
                        required: [status, detail]
                        properties:
                          status:
                            type: string
                            enum: [ok, error, unknown]
                          detail:
                            type: string
                            minLength: 1
  /api/health:
    get:
      summary: GET /api/health
      operationId: get_api_health
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
