paths:
  /api/workflow/provision:
    post:
      summary: POST /api/workflow/provision
      operationId: post_api_workflow_provision
      tags:
        - Workflow
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyJSON'
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workflow/rpc:
    post:
      summary: POST /api/workflow/rpc
      description: |-
        Relays one procedure to the named box's flow host. `Registration.Report`
        is answered by the backend instead: with `{"repo": "owner/name"}` as
        the payload it returns `{"ok": true, "payload": {"report": ...}}`, the
        finished registration report another account recorded for that public
        GitHub repository at its current commit (`repo`, `commit`, `report`,
        `recordedAt`), or `null`. Private repositories never have one.
        The backend records a report itself when it relays the journal of a
        completed `register-repository` run of a public repository.
      operationId: post_api_workflow_rpc
      tags:
        - Workflow
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyJSON'
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
