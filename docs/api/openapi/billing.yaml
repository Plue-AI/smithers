  /api/billing/checkout:
    post:
      summary: POST /api/billing/checkout
      operationId: post_api_billing_checkout
      tags:
        - Billing
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
                - interval
              properties:
                plan:
                  type: string
                  enum:
                    - personal
                    - pro
                    - max
                interval:
                  type: string
                  enum:
                    - monthly
                    - annual
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '201':
          description: Successful response
          content:
