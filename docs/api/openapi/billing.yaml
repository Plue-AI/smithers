paths:
  /api/billing:
    get:
      summary: GET /api/billing
      operationId: get_api_billing
      tags:
        - Billing
      parameters: []
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiBillingOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/billing/plans:
    get:
      summary: GET /api/billing/plans
      operationId: get_api_billing_plans
      tags:
