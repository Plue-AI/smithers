paths:
  /api/terminals:
    post:
      x-composition: install
      summary: Open a branch terminal
      description: Opens a signed-in terminal as the authenticated member on the branch. Retained terminal WebSocket attachments authorize branch.join; only the owner types. Refuses without owner-uid machine session providers.
      operationId: post_api_terminals
      tags:
        - Terminals
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              additionalProperties: false
              properties:
                branch:
                  type: string
      responses:
        '201':
          description: Owner terminal opened. Attach through the retained repository terminal WebSocket using id.
          content:
            application/json:
              schema:
                type: object
                required: [id, branch]
                properties:
                  id:
                    type: string
                    format: uuid
                  branch:
                    type: string
                    format: uuid
        '400':
          description: Invalid terminal request
        '401':
          description: Authentication required
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '503':
          description: Owner-uid terminal providers unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, class, message]
                properties:
                  code:
                    type: string
                    enum: [terminal_unavailable]
                  class:
                    type: string
                    enum: [infra]
                  message:
                    type: string
                    enum: [Terminal is unavailable]
