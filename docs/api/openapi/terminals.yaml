paths:
  /api/terminals:
    post:
      x-composition: install
      summary: Open a branch terminal
      description: Requests a signed-in terminal as the authenticated member on the branch. Retained terminal WebSocket attachments authorize branch.join; only the owner types. Refuses without owner-uid machine session providers.
      operationId: post_api_terminals
      tags:
        - Terminals
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              additionalProperties: false
              properties:
                branch:
                  type: string
      responses:
        '202':
          description: Terminal requested. The pending receipt is not a running terminal.
          content:
            application/json:
              schema:
                type: object
                required: [id, workspace_id, user_id, status]
                properties:
                  id: {type: string, format: uuid}
                  workspace_id: {type: string, format: uuid}
                  user_id: {type: integer, format: int64}
                  status: {type: string, enum: [pending, running, failed, closed]}
        '400':
          description: Invalid terminal request
        '401':
          description: Authentication required
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '503':
          description: Owner-uid terminal providers unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, class, message]
                properties:
                  code:
                    type: string
                    enum: [terminal_unavailable]
                  class:
                    type: string
                    enum: [infra]
                  message:
                    type: string
                    enum: [Terminal is unavailable]
