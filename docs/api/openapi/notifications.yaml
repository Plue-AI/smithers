paths:
  /api/notifications:
    get:
      summary: GET /api/notifications
      operationId: get_api_notifications
      tags:
        - Notifications
      parameters: []
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/notifications/events:
    get:
      summary: GET /api/notifications/events
      operationId: get_api_notifications_events
      tags:
        - Notifications
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          description: Exclusive per-user lifecycle journal sequence; zero rebuilds from the explicit baseline.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Authorized lifecycle facts through a committed journal head. visibility_filtered requires a fresh rebuild for incremental consumers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationFactPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/notifications/events/stream:
    get:
      summary: GET /api/notifications/events/stream
      operationId: get_api_notifications_events_stream
      tags:
        - Notifications
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          description: Exclusive per-user lifecycle journal sequence; zero rebuilds from the explicit baseline.
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Per-user lifecycle sequence; takes precedence over after. This is not the legacy notification ID cursor.
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/notifications/list:
    get:
      summary: GET /api/notifications/list
      operationId: get_api_notifications_list
      tags:
        - Notifications
      parameters: []
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiNotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/notifications/preferences:
    get:
      summary: GET /api/notifications/preferences
