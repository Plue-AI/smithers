paths:
  /api/ssh:
    get:
      x-composition: install
      summary: Read branch SSH connection details
      operationId: get_api_ssh
      tags:
        - Branches
      parameters:
        - in: query
          name: branch
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Connection details for an accessible branch
          content:
            application/json:
              schema:
                type: object
                required: [branch, host, port, value]
                properties:
                  branch: {type: string}
                  host: {type: string}
                  port: {type: integer, const: 2222}
                  value: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: Branch services unavailable
  /api/branches:
    get:
      x-composition: install
      summary: List the install repository's branches
      description: Each branch is a projection of its workspace (spec §6.3, §8.1.2); there is no branches table.
      operationId: get_api_branches
      tags:
        - Branches
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Branches with their kind, head and machine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '401':
          description: No person's browser session
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '503':
          description: Branch machines or the install repository unavailable
    post:
      x-composition: install
      summary: Fork a scratch branch
      description: >-
        The stack service forks main, a TODO or a scratch branch into
        scratch/<member>/<name> (spec §8.5). Awake sources are captured by the
        unprivileged daemon before selecting the revision, without stopping
        the machine. The branch stays in the install repository (M-22).
      operationId: post_api_branches
      tags:
        - Branches
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from]
              properties:
                from:
                  description: main, a TODO such as T2, or scratch/member/name.
                  type: string
                name:
                  description: The scratch branch's last segment; defaults to fork-<from>.
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]*(\.[a-z0-9_-]+)*$'
                  maxLength: 48
      responses:
        '201':
          description: The scratch branch, forked from its source; the same name from the same revision answers the same branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: Invalid from or name, or a scratch branch as from (scratch_fork_unavailable)
        '401':
          description: No person's browser session
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          description: No such TODO (todo_not_found)
        '409':
          description: The TODO has no verified head yet (no_verified_head), is settled (todo_settled), or the branch exists from another revision
        '503':
          description: The stack service, the repository or branch machines unavailable
  /api/branches/{b}/add-to-stack:
    post:
      x-composition: install
      summary: Add a scratch branch to the stack
      description: >-
        The stack service retains the captured tree as one change from the fork
        base, records its diff in revision 1, and adopts the existing workspace.
        Placement defaults to after the source TODO, or append for main.
        Delegated requests return a private confirmation; only the person's
        browser approval performs adoption. Awake branches require S2 capture.
      operationId: post_api_branches_b_add_to_stack
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: b
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              not:
                required: [after, before]
              properties:
                text: {type: string}
                title: {type: string}
                acceptance:
                  type: array
                  items: {type: string}
                after: {type: integer, minimum: 1}
                before: {type: integer, minimum: 1}
      responses:
        '202':
          description: Adopted TODO, or pending private confirmation
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [accepted, pending]}
                  n: {type: integer, minimum: 1}
                  rev: {type: integer, minimum: 1}
                  confirmation: {type: string}
        '400': {description: Invalid text or placement}
        '401': {description: No authenticated person}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: Branch not found}
        '409': {description: Branch changed, placement unavailable, or idempotency mismatch}
        '503': {description: Required admission, capture, confirmation or stack provider unavailable}
  /api/branches/{b}:
    get:
      x-composition: install
      summary: Read one branch
      operationId: get_api_branches_b
      tags:
        - Branches
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: b
          required: true
          description: The branch name, URL-encoded (scratch%2Fben%2Ftry).
          schema:
            type: string
      responses:
        '200':
          description: The branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          description: No person's browser session
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          description: No such branch
        '503':
          description: Branch machines unavailable
    post:
      x-composition: install
      summary: Request a branch operation
      operationId: post_api_branches_b
      tags:
        - Branches
      description: Sleep and wake persist a person request before capture or admission and return its durable receipt. Machine state changes only after execution; completed command-runs receipts include machine and failures include error. Rebase now uses the stack-selected target. Scratch Done binds conflict_change and onto_revision to the retained conflict. Run and machine credentials cannot invoke rebase. Required execution providers must be available before effects. Discard requires a maintainer browser session; outside-push decisions bind id and revision to the displayed commit.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: b
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [op]
                  properties:
                    op: {type: string, enum: [sleep, wake]}
                - type: object
                  additionalProperties: false
                  required: [op, id, revision]
                  properties:
                    op: {type: string, enum: [bring-in, discard-foreign]}
                    id: {type: string}
                    revision: {type: string, pattern: '^[a-f0-9]{40}$'}
                - type: object
                  additionalProperties: false
                  required: [rebase]
                  properties:
                    rebase: {type: boolean, enum: [true]}
                    op: {type: string, enum: [rebase]}
                - type: object
                  additionalProperties: false
                  required: [op]
                  properties:
                    op: {type: string, enum: [rebase]}
                    rebase: {type: boolean, enum: [false]}
                - type: object
                  additionalProperties: false
                  required: [conflict_change, onto_revision]
                  properties:
                    conflict_change: {type: string, minLength: 1, maxLength: 128}
                    onto_revision: {type: string, minLength: 1, maxLength: 128}
                    op: {type: string, enum: [rebase]}
                    rebase: {type: boolean, enum: [false]}
      responses:
        '202':
          description: Decision recorded
          content:
            application/json:
              schema: {"oneOf":[{"type":"object","properties":{"state":{"type":"string","enum":["accepted"]},"n":{"type":"integer"}}},{"$ref":"#/components/schemas/ConfirmationReceipt"},{"$ref":"#/components/schemas/FlowRunReceipt"}]}
        '400':
          description: Invalid answer or missing Idempotency-Key
        '401':
          description: No person session
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          description: No TODO on this branch
        '409':
          description: Stale target, unresolved conflict, settled wait, changed request, or publication recovering
        '503':
          description: Checkpoint rebase or required provider unavailable
  /api/branches/{b}/activity:
    get:
      x-composition: install
      summary: Read retained branch activity
      description: >-
        Returns the latest 200 activity entries in chronological order from the
        same host projection as branch:{id}:activity. Never wakes the machine.
      operationId: get_api_branches_activity
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: b
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Retained activity
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
        '401': {description: Sign in required}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: Branch not found}
        '503': {description: Activity provider unavailable}
  /api/branches/{b}/diff:
    get:
      x-composition: install
      summary: Read an accepted TODO item diff
      description: Compares the accepted item's tree against its accepted prefix candidate. Refuses before reads until identity, accepted-prefix and caller-authorization providers qualify. Never falls back to the current main or a working tree.
      operationId: get_api_branches_b_diff
      tags:
        - Branches
      parameters:
        - in: path
          name: b
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item-only files in DiffCard form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TODOBranchDiff'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Accepted TODO diff dependencies unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, class, message]
                properties:
                  code:
                    type: string
                    const: dependency_unavailable
                  class:
                    type: string
                    const: infra
                  message:
                    type: string
  /api/branches/{b}/files/{path}:
    get:
      x-composition: install
      summary: Read a file from the branch mirror
      description: Reads source data without waking a machine or executing repository code. Main is pinned to the last successful GitHub mirror commit. Run and machine credentials may read current files only on their stored TODO branch; at, digest and compare selectors are refused.
      operationId: get_api_branch_file
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: b
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: path
          required: true
          description: Repository-relative file path, including slash-separated directories.
          schema: {type: string}
        - name: at
          in: query
          description: Immutable mirrored commit for a pinned history read; never a working copy.
          schema: {type: string}
      responses:
        '200':
          description: Read-only File card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchFileCard'
        '400':
          description: Invalid repository path
        '401':
          description: Not signed in
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          description: File or branch not found
        '503':
          description: Source or authority unavailable
    post:
      x-composition: install
      summary: Restore a saved file version on a branch
      operationId: post_api_branch_file
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: b
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, version, base_digest]
              properties:
                action: {type: string, enum: [restore, restore-deleted]}
                version: {type: string}
                base_digest: {type: string}
                text:
                  type: string
                  description: Last live document text for restore-deleted, at most 1 MiB UTF-8. Omit to restore the retained before-version.
      responses:
        '200':
          description: File restored against its current digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyJSON'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '409':
          description: File changed since this version
        '503':
          description: File restore unavailable
  /api/branches/{b}/files:
    get:
      x-composition: install
      summary: List branch files
      description: Run and machine credentials may list files only on their stored TODO branch. Other branches and main are refused.
      operationId: get_api_branches_b_files
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: b
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          schema: {type: string}
      responses:
        '200':
          description: File entries from the branch's current or verified retained snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, path, type]
                  properties:
                    name: {type: string}
                    path: {type: string}
                    type: {type: string}
                    size: {type: integer, format: int64}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/branches/{b}/lsp:
    post:
      x-composition: install
      summary: Admit a File card code-intelligence session
      description: Admits one language-server session per member, branch and language, under the code.hover command and branch.join. Starts no process. A sleeping branch is refused and never woken. The server runs only when the session's socket opens, as the requesting member's daemon exec session on the branch machine.
      operationId: post_api_branches_b_lsp
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - {name: b, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language]
              properties:
                language: {type: string, enum: [typescript]}
      responses:
        '201':
          description: Session admitted; the same member, branch and language reuse one id
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, language, branch]
                properties:
                  id: {type: string}
                  kind: {type: string, const: exec}
                  language: {type: string}
                  branch: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The branch is asleep
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/branches/{b}/lsp/{id}:
    get:
      x-composition: install
      summary: Relay a File card language server
      description: 'WebSocket upgrade with subprotocol lsp. Reruns the code.hover decision and branch.join, then starts the language server as the requesting member''s daemon exec session and relays JSON-RPC 2.0: one message per text frame up to 1 MiB, larger messages as {seq,last,data} fragments. Closes 1000 with language_server_missing: <install line>, language_server_idle after 10 minutes, or language_server_exited: 0; 1011 language_server_exited: <code>; 1008 when access is revoked.'
      operationId: get_api_branches_b_lsp_id
      tags:
        - Branches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - {name: b, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
        - {name: ticket, in: query, description: One-use socket ticket, schema: {type: string}}
      responses:
        '101':
          description: Switching to the lsp WebSocket
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The branch is asleep
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/branches/{b}/archive:
    post:
      x-composition: install
      summary: Archive a scratch branch
      operationId: post_api_branches_b_archive
      tags:
        - Branches
      security: [{sessionCookie: []}]
      parameters:
        - {name: b, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Archived branch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Branch'}
        '401': {description: Sign in}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: Branch unavailable}
        '409': {description: Branch cannot be archived}
        '503': {description: Branch archive unavailable}
components:
  schemas:
    Branch:
      type: object
      required: [name, kind, state, machine]
      properties:
        todo_id: {type: string, description: The adopted TODO id, when this branch is its current workspace.}
        name:
          type: string
        kind:
          type: string
          enum: [scratch, item, main]
        state:
          type: string
          enum: [awake, releasing, asleep, waking, provisioning, failed, closed]
        head:
          description: A scratch branch's branch ref in the install's repository; any other branch's machine head.
          type: string
        forked_from:
          type: object
          required: [kind, ref, commit, base]
          properties:
            kind:
              type: string
              enum: [main, item, branch]
            ref:
              description: main, the TODO (T2), or the scratch source branch.
              type: string
            commit:
              description: The revision the fork started from, captured first for awake sources.
              type: string
            base:
              description: The revision the TODO's change is measured from in that head; main's tip for a fork of main.
              type: string
            item:
              description: The TODO's number.
              type: integer
              minimum: 1
        machine:
          type: object
          additionalProperties: true
          properties:
            wait_position:
              type: integer
              minimum: 1
    TODOBranchDiff:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/TODOBranchDiffModel'
    TODOBranchDiffModel:
      type: object
      required: [path, branch, against, change, hunks]
      properties:
        path:
          type: string
        branch:
          type: string
        against:
          type: object
          required: [kind, rev]
          properties:
            kind:
              type: string
              const: item_base
            rev:
              type: string
        change:
          type: string
          enum: [added, modified, deleted, renamed]
        renamed_to:
          type: string
        binary:
          type: object
          required: [before_bytes, after_bytes]
          properties:
            before_bytes:
              type: integer
              minimum: 0
            after_bytes:
              type: integer
              minimum: 0
        hunks:
          type: array
          items:
            type: object
            required: [old_start, new_start, lines]
            properties:
              old_start:
                type: integer
                minimum: 0
              new_start:
                type: integer
                minimum: 0
              lines:
                type: array
                items:
                  type: object
                  required: [op, text]
                  properties:
                    op:
                      type: string
                      enum: [' ', '+', '-']
                    text:
                      type: string
    BranchFileCard:
      type: object
      required: [path, branch, language, digest, content, mode, diagnostics, authors, editors]
      properties:
        path: {type: string}
        branch: {type: string}
        language: {type: string}
        digest: {type: string}
        mode: {type: string, enum: [read_only]}
        content:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [text, too_large, binary]}
            text: {type: string}
            bytes: {type: integer}
        diagnostics: {type: array, items: {type: object}}
        authors: {type: array, items: {type: object}}
        editors: {type: array, items: {type: object}}
