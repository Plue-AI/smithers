paths:
  /api/github/import/{id}:
    get:
      summary: GET /api/github/import/{id}
      operationId: get_api_github_import_id
      tags:
        - Github
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/json
              - text/event-stream
          description: Use text/event-stream to receive import_job SSE frames until the job reaches a terminal state.
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: 'Import job status. With Accept: text/event-stream, streams import_job events using the same JSON payload shape.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiGitHubImportJob'
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/github/synced-repos:
    get:
      summary: GET /api/github/synced-repos
      operationId: get_api_github_synced_repos
      tags:
        - Github
      parameters: []
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/github/import:
    post:
      summary: POST /api/github/import
      operationId: post_api_github_import
      tags:
        - Github
      parameters: []
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiGitHubImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/github/import/{id}/retry:
    post:
      summary: POST /api/github/import/{id}/retry
      operationId: post_api_github_import_id_retry
      tags:
        - Github
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-smithers-client-contract: multi-v1
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiGitHubImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/github/synced-repos/{owner}/{repo}/mirror-status:
    post:
      summary: POST /api/github/synced-repos/{owner}/{repo}/mirror-status
      operationId: post_api_github_synced_repos_owner_repo_mirror_status
      tags:
        - Github
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
