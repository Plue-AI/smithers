  /api/admin/users/{username}/erase:
    post:
      summary: POST /api/admin/users/{username}/erase
      description: Erases the user's owned data, including stored workspace snapshots, and replaces the account with a tombstone identity. Keeps billing, credit-ledger and tax records with the name and email removed. Repeating the erase changes nothing and succeeds. With user_id the erase targets exactly that account, which must hold or have held the username. Without it, a username registered after the request date resolves to the earlier tombstone; a live account created after the request date, or a name reused after an earlier erase when both accounts predate the request, is refused with 409. An admin.user.erase_started event is written before any teardown and an admin.user.erase event with the result.
      operationId: post_api_admin_users_username_erase
      tags:
        - Admin
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_date
              properties:
                request_date:
                  type: string
                  format: date
                  description: Date the user asked for deletion (YYYY-MM-DD).
                user_id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Account that asked; a retry passes the user_id the first erase returned.
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    format: int64
                  tombstone:
                    type: string
                  already_erased:
                    type: boolean
                  rows_changed:
                    type: integer
                    format: int64
                  repositories:
                    type: integer
                  workspaces:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{username}/export:
    post:
      summary: POST /api/admin/users/{username}/export
      description: Returns the account's data as a gzip-compressed tar archive, built in full before the response starts. The archive holds profile.json, repositories.json, one cloneable git bundle per owned repository under repositories/, issues.json, comments.json, landing_requests.json, runs.json, and manifest.json listing every other file with its size, SHA-256 and record count. Each export writes an admin.user.export audit event.
      operationId: post_api_admin_users_username_export
      tags:
        - Admin
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The export archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
