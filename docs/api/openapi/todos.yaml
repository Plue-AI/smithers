paths:
  /api/todos:
    get:
      x-composition: install
      summary: Read the install repository TODOs
      operationId: get_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      responses:
        '200':
          description: TODO card projections
        '403':
          description: Install owner session required
        '503':
          description: Install repository unavailable
    post:
      x-composition: install
      summary: Append a TODO to the install repository stack
      operationId: post_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, prompt]
              properties:
                title: {type: string, minLength: 1, maxLength: 256}
                prompt: {type: string, minLength: 1, maxLength: 65536}
                acceptance:
                  type: array
                  items: {type: string}
                place: {type: string, enum: [append]}
      responses:
        '202':
          description: Persisted TODO creation; execution has not completed
          content:
            application/json:
              schema:
                type: object
                required: [state, n, rev]
                properties:
                  state: {type: string, enum: [accepted]}
                  n: {type: integer, minimum: 1}
                  rev: {type: integer, minimum: 1}
        '400':
          description: Invalid TODO or missing Idempotency-Key
        '403':
          description: Install owner session required
        '409':
          description: Idempotency-Key reused for a different request
        '503':
          description: Repository stack unavailable
  /api/todos/{n}:
    get:
      x-composition: install
      summary: Read a TODO by its repository number
      operationId: get_api_todos_n
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: TODO card projection
        '400':
          description: Invalid TODO number
        '403':
          description: Install owner session required
        '404':
          description: TODO not found
        '503':
          description: Install repository unavailable
