paths:
  /api/todos:
    get:
      x-composition: install
      summary: Read the install repository TODOs
      operationId: get_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      responses:
        '200':
          description: TODO card projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoCard'
        '403':
          description: Install owner session required
        '503':
          description: Install repository unavailable
    post:
      x-composition: install
      summary: Append a TODO to the install repository stack
      operationId: post_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, prompt]
              properties:
                title: {type: string, minLength: 1, maxLength: 256}
                prompt: {type: string, minLength: 1, maxLength: 65536}
                acceptance:
                  type: array
                  items: {type: string}
                place:
                  description: Where the TODO goes; absent appends. Before and amend are refused with invalid_place until T-STK-02.
                  type: object
                  additionalProperties: false
                  required: [mode]
                  properties:
                    mode: {type: string, enum: [append, before, amend]}
                    n: {type: integer, minimum: 1}
      responses:
        '202':
          description: Persisted TODO creation; execution has not completed
          content:
            application/json:
              schema:
                type: object
                required: [state, n, rev]
                properties:
                  state: {type: string, enum: [accepted]}
                  n: {type: integer, minimum: 1}
                  rev: {type: integer, minimum: 1}
        '400':
          description: Invalid TODO, missing Idempotency-Key, or invalid_place
        '403':
          description: Install owner session required
        '409':
          description: Idempotency-Key reused for a different request
        '503':
          description: Repository stack unavailable
  /api/todos/{n}:
    get:
      x-composition: install
      summary: Read a TODO by its repository number
      operationId: get_api_todos_n
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: TODO card projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoCard'
        '400':
          description: Invalid TODO number
        '403':
          description: Install owner session required
        '404':
          description: TODO not found
        '503':
          description: Install repository unavailable
  /api/todos/{n}/merge:
    post:
      x-composition: install
      summary: Request a session-approved squash merge at the reviewed head
      operationId: post_api_todos_n_merge
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewed_head_sha]
              properties:
                reviewed_head_sha: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
      responses:
        '202':
          description: Merge request accepted; completion requires GitHub and main containment
        '400':
          description: Invalid TODO number or reviewed head
        '403':
          description: Install owner browser session required
        '404':
          description: TODO not found
        '409':
          description: Stale head or merge facts unavailable; no merge sent
        '503':
          description: Install repository unavailable
components:
  schemas:
    TodoCard:
      description: One TODO as the TODO card shows it. TodoCardSchema in packages/rpc/src/TodoCard.ts is the full contract; members not listed here are kept.
      type: object
      additionalProperties: true
      required: [n, title, state, owner, prompt_revisions, steps, waits, steers, evidence, merge, present]
      properties:
        n: {type: integer, minimum: 1}
        title: {type: string}
        state: {type: string}
        owner:
          type: object
          required: [login, name, avatar_url]
          properties:
            login: {type: string}
            name: {type: string}
            avatar_url: {type: string}
        place: {type: integer, minimum: 1}
        prompt_revisions:
          type: array
          items:
            type: object
            required: [text, acceptance, by, at]
            properties:
              text: {type: string}
              acceptance:
                type: array
                items: {type: string}
              by: {type: object, additionalProperties: true}
              at: {type: string}
        branch:
          type: object
          required: [id, name, machine]
          properties:
            id: {type: string}
            name: {type: string}
            machine: {type: object, additionalProperties: true}
        run:
          type: object
          required: [id, attempt, indicators]
          properties:
            id: {type: string}
            attempt: {type: integer, minimum: 1}
            indicators:
              type: array
              items: {type: object, additionalProperties: true}
        pr:
          type: object
          required: [number, url, head, draft, included_items]
          properties:
            number: {type: integer, minimum: 1}
            url: {type: string}
            head: {type: string}
            draft: {type: boolean}
            draft_after: {type: integer, minimum: 1}
            included_items:
              type: array
              items: {type: integer, minimum: 1}
        steps:
          type: array
          items: {type: object, additionalProperties: true}
        waits:
          type: array
          items: {type: object, additionalProperties: true}
        steers:
          type: array
          items: {type: object, additionalProperties: true}
        evidence:
          type: array
          items: {type: object, additionalProperties: true}
        merge:
          type: object
          required: [state, on_github]
          properties:
            state: {type: string, enum: [ready, waiting, blocked, merging, done]}
            reason: {type: string}
            detail: {type: string}
            on_github: {type: boolean}
        present:
          type: array
          items: {type: object, additionalProperties: true}
