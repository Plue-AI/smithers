paths:
  /api/todos:
    get:
      x-composition: install
      summary: Read the install repository TODOs
      operationId: get_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      responses:
        '200':
          description: TODO card projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoCard'
        '403':
          description: Not a member, not a person's browser session, or (merge) not a maintainer
        '503':
          description: Install repository unavailable
    post:
      x-composition: install
      summary: Append a TODO to the install repository stack
      operationId: post_api_todos
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, prompt]
              properties:
                title: {type: string, minLength: 1, maxLength: 256}
                prompt: {type: string, minLength: 1, maxLength: 65536}
                acceptance:
                  type: array
                  items: {type: string}
                place:
                  description: Where the TODO goes; absent appends. Before and amend are refused with invalid_place until T-STK-02.
                  type: object
                  additionalProperties: false
                  required: [mode]
                  properties:
                    mode: {type: string, enum: [append, before, amend]}
                    n: {type: integer, minimum: 1}
                issue:
                  description: Make TODO. The GitHub issue number the Draft was made from; requires issue_digest. The TODO becomes the issue's, and an issue holds one unmerged TODO.
                  type: integer
                  minimum: 1
                issue_digest:
                  description: SHA-256 hex of the issue's title, a NUL byte and its body, as the Draft read them. An issue changed since is refused with issue_changed.
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                fixes:
                  description: Whether merging the TODO closes the issue; requires issue. Absent means true.
                  type: boolean
      responses:
        '202':
          description: Persisted TODO creation; execution has not completed
          content:
            application/json:
              schema:
                type: object
                required: [state, n, rev]
                properties:
                  state: {type: string, enum: [accepted]}
                  n: {type: integer, minimum: 1}
                  rev: {type: integer, minimum: 1}
        '400':
          description: Invalid TODO, missing Idempotency-Key, invalid_place, or an issue reference that is incomplete or names a pull request
        '403':
          description: Not a member, not a person's browser session, or (merge) not a maintainer
        '409':
          description: Idempotency-Key reused for a different request; issue_changed, issue_closed, or issue_has_todo for Make TODO
        '503':
          description: Repository stack unavailable, or github_unavailable when Make TODO cannot read the issue
  /api/todos/{n}:
    get:
      x-composition: install
      summary: Read a TODO by its repository number
      operationId: get_api_todos_n
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: TODO card projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoCard'
        '400':
          description: Invalid TODO number
        '403':
          description: Not a member, not a person's browser session, or (merge) not a maintainer
        '404':
          description: TODO not found
        '503':
          description: Install repository unavailable
    post:
      x-composition: install
      summary: Steer the coding agent, or stop, resume, retry or drop a TODO
      description: A steer is {"op":"steer","text":...} or {"steer":...}; a retry may carry a steer. Members steer, stop, resume, retry and drop TODOs. Retry of a failed TODO starts attempt n+1 of its pinned flow with the steer as its first input and answers that attempt. Drop of an unmerged TODO cancels its run, stops every later TODO waiting on it to merge, and closes its pull request with the comment "Dropped in Smithers by @login". The same Idempotency-Key answers a Retry or a Drop again. Every other control answers todo_control_unavailable until its service is composed (T-STK-05, T-STK-06).
      operationId: post_api_todos_n
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                op: {type: string, enum: [steer, stop, resume, retry, retry-current-flow, drop]}
                steer: {type: string, minLength: 1, maxLength: 65536}
                text: {type: string, minLength: 1, maxLength: 65536}
      responses:
        '202':
          description: The control was recorded; a retry names the attempt it starts
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [accepted]}
                  attempt: {type: integer, minimum: 1}
        '400':
          description: Invalid TODO number, invalid_control, invalid_steer, or a missing Idempotency-Key
        '403':
          description: Not a member, or not a person's browser session
        '404':
          description: todo_not_found
        '409':
          description: The TODO is merging or settled, the control does not apply to its state (Retry of a TODO that has not failed), or a GitHub write on it is settling
        '503':
          description: todo_control_unavailable
  /api/todos/{n}/merge:
    post:
      x-composition: install
      summary: Request a session-approved squash merge at the reviewed head
      operationId: post_api_todos_n_merge
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: Idempotency-Key
          in: header
          required: true
          description: Names the press; the same key again answers its receipt and records no new approval.
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewed_head_sha]
              properties:
                reviewed_head_sha: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
      responses:
        '202':
          description: Approval and merge fence recorded, or the same Idempotency-Key's request answered again; Merged requires GitHub's merge and main containment
        '400':
          description: Invalid TODO number, reviewed head or missing Idempotency-Key
        '401':
          description: No credential, or the browser session has ended
        '403':
          description: Install owner browser session or GitHub maintainer required (permission); a request an in-app agent makes with the person's session, Smithers-Via, is never
        '404':
          description: TODO not found
        '409':
          description: A MergeReady row refuses (stale_head carries GitHub's current head), GitHub's facts are not fresh, the Idempotency-Key was used for a different request, or the same request's approval was refused or expired (its retained refusal); no merge sent
        '503':
          description: Install repository unavailable
  /api/todos/{n}/answer:
    post:
      x-composition: install
      summary: Answer the coding agent's open question; the first answer settles it and resumes the run
      operationId: post_api_todos_n_answer
      tags:
        - Todos
      security:
        - sessionCookie: []
      parameters:
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [wait, answer]
              properties:
                wait:
                  description: The open question's id, as the TODO card's waits list it.
                  type: string
                  minLength: 1
                  maxLength: 128
                answer: {type: string, minLength: 1, maxLength: 131072}
      responses:
        '202':
          description: The answer settled the question and its signal to the parked run is admitted, or the same person's same answer was sent again
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [accepted]}
        '400':
          description: Invalid TODO number, question or answer
        '403':
          description: Not a member, not a person's browser session, or (merge) not a maintainer
        '404':
          description: TODO or question not found
        '409':
          description: Someone already answered (answered_by names them), the agent no longer asks the question, or the TODO is settled
          content:
            application/json:
              schema:
                type: object
                required: [code, class, message]
                properties:
                  code: {type: string}
                  class: {type: string}
                  message: {type: string}
                  answered_by: {type: string}
        '503':
          description: Install repository or run signalling unavailable
components:
  schemas:
    TodoCard:
      description: One TODO as the TODO card shows it. TodoCardSchema in packages/rpc/src/TodoCard.ts is the full contract; members not listed here are kept.
      type: object
      additionalProperties: true
      required: [n, title, state, owner, prompt_revisions, steps, waits, steers, evidence, merge, present]
      properties:
        n: {type: integer, minimum: 1}
        title: {type: string}
        state: {type: string}
        owner:
          type: object
          required: [login, name, avatar_url]
          properties:
            login: {type: string}
            name: {type: string}
            avatar_url: {type: string}
        place: {type: integer, minimum: 1}
        prompt_revisions:
          type: array
          items:
            type: object
            required: [text, acceptance, by, at]
            properties:
              text: {type: string}
              acceptance:
                type: array
                items: {type: string}
              by: {type: object, additionalProperties: true}
              at: {type: string}
              reason:
                description: from-issue on revision 1 of a TODO made from an issue (Make TODO or the todo label).
                type: string
              issue_digest: {type: string}
        issue:
          description: The GitHub issue the TODO was made from, and whether merging the TODO closes it.
          type: object
          required: [number, url, fixes]
          properties:
            number: {type: integer, minimum: 1}
            url: {type: string}
            fixes: {type: boolean}
        branch:
          type: object
          required: [id, name, machine]
          properties:
            id: {type: string}
            name: {type: string}
            machine: {type: object, additionalProperties: true}
        run:
          type: object
          required: [id, attempt, indicators]
          properties:
            id: {type: string}
            attempt: {type: integer, minimum: 1}
            indicators:
              type: array
              items: {type: object, additionalProperties: true}
        pr:
          type: object
          required: [number, url, head, draft, included_items]
          properties:
            number: {type: integer, minimum: 1}
            url: {type: string}
            head: {type: string}
            draft: {type: boolean}
            draft_after: {type: integer, minimum: 1}
            included_items:
              type: array
              items: {type: integer, minimum: 1}
        steps:
          type: array
          items: {type: object, additionalProperties: true}
        waits:
          type: array
          items: {type: object, additionalProperties: true}
        steers:
          type: array
          items: {type: object, additionalProperties: true}
        evidence:
          type: array
          items: {type: object, additionalProperties: true}
        merge:
          type: object
          required: [state, on_github]
          properties:
            state: {type: string, enum: [ready, waiting, blocked, merging, done]}
            reason: {type: string}
            detail: {type: string}
            on_github: {type: boolean}
        present:
          type: array
          items: {type: object, additionalProperties: true}
