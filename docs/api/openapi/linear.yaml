paths:
  /api/linear/{id}/ops:
    get:
      summary: GET /api/linear/{id}/ops
      operationId: get_api_linear_id_ops
      tags:
        - Linear
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - success
              - failed
              - skipped
        - name: since
          in: query
          required: false
          description: Only return operations created at or after this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's Link header.
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: A reverse-chronological keyset page of Linear sync operations.
          headers:
            Link:
              description: Contains rel=next when an older page is available.
              schema:
                type: string
            X-Per-Page:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinearSyncOps'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/linear/{id}/sync/{runId}:
    get:
      summary: GET /api/linear/{id}/sync/{runId}
      operationId: get_api_linear_id_sync_runid
      tags:
        - Linear
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinearSyncRunStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/linear/setup/{setupKey}:
    get:
      summary: GET /api/linear/setup/{setupKey}
      description: Returns the authorizing Linear actor, available teams, and setup expiry. OAuth tokens are never returned.
      operationId: get_api_linear_setup_setupkey
      tags:
        - Linear
      parameters:
        - name: setupKey
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinearOAuthSetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/linear:
    post:
      summary: POST /api/linear
      description: Consumes a pending Linear OAuth setup and connects the selected team to a repository the caller administers.
      operationId: post_api_linear
      tags:
        - Linear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinearIntegrationCreateRequest'
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/linear/{id}/ops/{opId}/retry:
    post:
      summary: POST /api/linear/{id}/ops/{opId}/retry
      operationId: post_api_linear_id_ops_opid_retry
      tags:
        - Linear
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: opId
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/linear/{id}/sync:
    post:
      summary: POST /api/linear/{id}/sync
      operationId: post_api_linear_id_sync
      tags:
        - Linear
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
