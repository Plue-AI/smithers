paths:
  /api/secrets:
    get:
      summary: GET /api/secrets
      operationId: get_api_secrets
      x-composition: install
      tags:
        - Secrets
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: PUT /api/secrets
      description: 'Owner and maintainer browser sessions set an install repository secret (`name`, `value`). Optional `main_only`, and `hosts` with `match_headers`: the hosts and request headers the secret may be sent to, both or neither. Omitted, a replaced secret keeps its scope and binding. Person only.'
      operationId: put_api_secrets
      x-smithers-opaque-body: true
      x-composition: install
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRepositorySecretRequest'
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Secret stored. Metadata only, never the value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: DELETE /api/secrets
      operationId: delete_api_secrets
      x-composition: install
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      security:
        - sessionCookie: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/secrets/{name}:
    patch:
      summary: PATCH /api/secrets/{name}
      description: 'Marks a repository secret main-only (`{"main_only": true}`) or clears the mark, and sets its host binding (`{"hosts": ["api.example.com"], "match_headers": ["authorization"]}`; empty lists unbind it), without its value. Main-only secrets are restricted to a maintainer''s manual trusted-main run in an ephemeral background machine; missing stored authority refuses delivery. Host-bound values stay on the relay. Unbound all-branches delivery refuses boot until the authenticated machine env channel and assigned session identities are available. Responses contain metadata only, never values. Person only.'
      operationId: patch_api_secrets_name
      x-smithers-opaque-body: true
      x-composition: install
      tags:
        - Secrets
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepositorySecretRequest'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Secret scope and binding updated. Metadata only, never the value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: DELETE /api/secrets/{name}
      operationId: delete_api_secrets_name
      x-composition: install
      tags:
        - Secrets
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
