paths:
  /api/install:
    get:
      summary: Read install address and GitHub App setup status
      operationId: get_api_install
      tags:
        - Install
      description: Requires the setup token until an owner exists, then the owner's browser session.
      security:
        - setupSession: []
        - sessionCookie: []
      responses:
        '200':
          description: GitHub App setup status without credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppSetupStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Change the install address
      operationId: put_api_install
      tags:
        - Install
      description: Owner browser session only. Origin must equal the effective origin and X-CSRF-Token must equal the CSRF cookie. Unavailable launcher, listener or transactional publication providers refuse before effects.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  $ref: '#/components/schemas/InstallAddress'
      responses:
        '200':
          description: Committed address; no backend restart
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address:
                    $ref: '#/components/schemas/InstallAddress'
        '422':
          description: Invalid bind or origins; class user with the field named
        '403':
          description: Owner required, or class permission with code origin or csrf; no mutation
        '421':
          description: Host matches no known origin; class user, code unknown_origin
        '503':
          description: Required serving provider unavailable; no settings or listener change
  /api/install/setup/app_manifest:
    post:
      summary: Begin or resume GitHub App setup
      operationId: post_api_install_setup_app
      tags:
        - Install
      description: Post the returned manifest to action_url in the same browser. Organization repositories require an organization owner to create the App at that URL. The callback consumes state once and refuses a second App.
      security:
        - setupSession: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppSetupRequest'
      responses:
        '200':
          description: Manifest and single-use browser state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppManifestStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This install already has a GitHub App
        '500':
          $ref: '#/components/responses/InternalError'
  /api/install/quiesce:
    post:
      summary: Freeze or renew install admissions
      operationId: post_api_install_quiesce
      tags:
        - Install
      description: Owner browser session only. Enabled only by install.quiesce_enabled. Renew the same operation every 10 seconds; the lease lasts 30 seconds.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Freeze lease, including whether execution has stopped
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Quiesced or required execution dependency unavailable
    delete:
      summary: Reopen install admissions
      operationId: delete_api_install_quiesce
      tags:
        - Install
      description: Owner browser session only. Refuses while .upgrade-incomplete exists. Enabled only by install.quiesce_enabled.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Admissions reopened
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Upgrade incomplete or freeze authority unavailable
components:
  schemas:
    InstallAddress:
      type: object
      required: [listen, bind, origins]
      properties:
        listen:
          type: string
          enum: [mac, network]
        bind:
          type: string
          description: Empty for loopback only; otherwise an IP bind address
        origins:
          type: array
          items:
            type: string
          description: HTTP or HTTPS origins with distinct browser Host values; scheme comes from these strings
    GitHubAppSetupRequest:
      type: object
      required:
        - owner_login
        - owner_kind
        - repository
      properties:
        resume:
          type: boolean
          description: Return the stored App installation URL without repeating conversion.
        owner_login:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
        owner_kind:
          type: string
          enum:
            - user
            - org
        repository:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
    GitHubAppSetupStatus:
      type: object
      required:
        - github_app
      properties:
        address:
          $ref: "#/components/schemas/InstallAddress"
        ssh_line:
          type: string
        github_app:
          type: object
          required:
            - configured
            - installed
          properties:
            configured:
              type: boolean
            installed:
              type: boolean
            slug:
              type: string
            installation_id:
              type: integer
              format: int64
            install_url:
              type: string
            callback_urls:
              type: array
              maxItems: 10
              items:
                type: string
                format: uri
            callback_fixes:
              type: array
              items:
                $ref: '#/components/schemas/GitHubAppCallbackFix'
    GitHubAppCallbackFix:
      type: object
      required:
        - settings_url
        - add_url
      properties:
        settings_url:
          type: string
          format: uri
        add_url:
          type: string
          format: uri
    GitHubAppManifestStart:
      type: object
      required:
        - action_url
        - manifest
        - state
      properties:
        install_url:
          type: string
          format: uri
        action_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 64
          maxLength: 64
        manifest:
          $ref: '#/components/schemas/GitHubAppManifest'
    GitHubAppManifest:
      type: object
      required:
        - name
        - url
        - redirect_url
        - setup_url
        - callback_urls
        - public
        - hook_attributes
        - default_permissions
        - default_events
      properties:
        name:
          type: string
          maxLength: 34
        url:
          type: string
          format: uri
        redirect_url:
          type: string
          format: uri
        setup_url:
          type: string
          format: uri
        callback_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        public:
          type: boolean
          const: false
        hook_attributes:
          type: object
          required:
            - url
            - active
          properties:
            url:
              type: string
              format: uri
            active:
              type: boolean
              const: false
        default_permissions:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        default_events:
          type: array
          items:
            type: string
