paths:
  /api/install/metrics:
    get:
      summary: Read in-process install metrics
      operationId: get_api_install_metrics
      tags: [Install]
      description: Owner browser session only. Cumulative Prometheus metric families are cross-checks, never client benchmark pass values. Missing producers are absent.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Cumulative in-process collector snapshot
          content:
            application/json:
              schema:
                type: object
                required: [collected_at, clock, metrics]
                properties:
                  collected_at:
                    type: string
                    format: date-time
                  clock:
                    type: string
                  metrics:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  live_connections:
                    type: integer
                    minimum: 0
                  host:
                    type: object
                    nullable: true
                    description: Existing Go host profile and derived limits; null when host profile detection is unavailable.
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/install/scorecard:
    get:
      summary: Read the alpha scorecard
      operationId: get_api_install_scorecard
      tags:
        - Install
      description: Owner person session only. Unmounted until the owner authorizer is available. Missing lifecycle producer coverage returns source_missing, never zero. Person-minutes are reviewed separately in sampled alpha sessions.
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scorecard for the half-open UTC window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallScorecard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Owner person session authorizer unavailable
        '500':
          $ref: '#/components/responses/InternalError'
  /api/install:
    get:
      summary: Read install setup
      operationId: get_api_install
      tags:
        - Install
      description: Setup-session cookie before claim; owner browser session after claim. Never accepts a Bearer setup token.
      security:
        - setupSession: []
        - sessionCookie: []
      responses:
        "200":
          description: Ordered setup steps and secret-free model access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupStatus"
        "401":
          description: Setup cookie or owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "403":
          description: Install owner required; cookie mutations require matching Origin and CSRF (permission/origin or permission/csrf).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "500":
          description: Install setup unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
    put:
      summary: Set owner install settings
      operationId: put_api_install
      tags:
        - Install
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - anyOf:
                    - required: [capacity]
                    - required: [chatgpt]
                - anyOf:
                    - required: [bind]
                    - required: [origins]
              properties:
                chatgpt:
                  type: boolean
                  description: Enable the owner ChatGPT subscription pool; off by default.
                bind:
                  type: string
                  description: Network IP address, optionally with port 4000; loopback always remains available.
                origins:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                  description: HTTP or HTTPS origins with distinct hosts and ports.
                capacity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated install status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupStatus"
        "400":
          description: Invalid setup body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "403":
          description: Install owner required; cookie mutations require matching Origin and CSRF (permission/origin or permission/csrf).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "422":
          description: Host capacity refusal
        "503":
          description: Install capacity unavailable
  /api/install/setup/address:
    post:
      summary: Run setup address
      operationId: post_api_install_setup_address
      tags:
        - Install
      security:
        - setupSession: []
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallSetupAddress"
      responses:
        "202":
          description: Durable setup admission
        "400":
          description: Invalid setup body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "401":
          description: Setup cookie or owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "403":
          description: Install owner required; cookie mutations require matching Origin and CSRF (permission/origin or permission/csrf).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "409":
          description: Setup order or lease conflict
        "503":
          description: Install quiesced or setup provider unavailable
  /api/install/setup/app:
    post:
      summary: Run setup app
      operationId: post_api_install_setup_app
      tags:
        - Install
      security:
        - setupSession: []
        - sessionCookie: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GitHubAppSetupRequest"
                - $ref: "#/components/schemas/GitHubAppManualRequest"
      responses:
        "200":
          description: Browser manifest or validated manual App installation URL
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GitHubAppManifestStart"
                  - type: object
                    required: [install_url]
                    properties:
                      install_url:
                        type: string
                        format: uri
        "400":
          description: Invalid setup body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "401":
          description: Setup cookie or owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "403":
          description: Install owner required; cookie mutations require matching Origin and CSRF (permission/origin or permission/csrf).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallSetupError"
        "409":
          description: Setup order or lease conflict
        "503":
          description: Install quiesced or setup provider unavailable
  /api/install/setup/sign_in:
