  /api/install/quiesce:
    post:
      summary: Freeze or renew install admissions
      operationId: post_api_install_quiesce
      tags:
        - Install
      description: Owner browser session only. Enabled only by install.quiesce_enabled. Renew the same operation every 10 seconds; the lease lasts 30 seconds.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Freeze lease, including whether execution has stopped
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Quiesced or required execution dependency unavailable
    delete:
      summary: Reopen install admissions
      operationId: delete_api_install_quiesce
      tags:
        - Install
      description: Owner browser session only. Refuses while .upgrade-incomplete exists. Enabled only by install.quiesce_enabled.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Admissions reopened
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Upgrade incomplete or freeze authority unavailable
components:
  schemas:
    ScorecardWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ScorecardMeasure:
      type: object
      required: [value, target, kill_signal, verdict, window, source_tables]
      properties:
        value:
          description: Null when source_missing; otherwise the automated measure's value.
        target:
          type: string
        kill_signal:
          type: string
        verdict:
          type: string
          enum: [pass, kill, between, source_missing, diagnostic]
        window:
          $ref: '#/components/schemas/ScorecardWindow'
        source_tables:
          type: array
          items:
            type: string
        missing_tickets:
          type: array
          items:
            type: string
    InstallScorecard:
      type: object
      required: [window, measures, person_minutes]
      properties:
        window:
          $ref: '#/components/schemas/ScorecardWindow'
        measures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ScorecardMeasure'
        person_minutes:
          type: object
          required: [source, verdict]
          properties:
            source:
              type: string
              enum: [sampled_alpha_sessions]
            verdict:
              type: string
              enum: [manual]
    GitHubAppCallbackFix:
      type: object
      required:
        - settings_url
        - add_url
      properties:
        settings_url:
          type: string
          format: uri
        add_url:
          type: string
          format: uri
    GitHubAppManifestStart:
      type: object
      required:
        - action_url
        - manifest
        - state
      properties:
        install_url:
          type: string
          format: uri
        action_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 64
          maxLength: 64
        manifest:
          $ref: '#/components/schemas/GitHubAppManifest'
    GitHubAppManifest:
      type: object
      required:
        - name
        - url
        - redirect_url
        - setup_url
        - callback_urls
        - public
        - hook_attributes
        - default_permissions
        - default_events
      properties:
        name:
          type: string
          maxLength: 34
        url:
          type: string
          format: uri
        redirect_url:
          type: string
          format: uri
        setup_url:
          type: string
          format: uri
        callback_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        public:
          type: boolean
          const: false
        hook_attributes:
          type: object
          required:
            - url
            - active
          properties:
            url:
              type: string
              format: uri
            active:
              type: boolean
              const: false
        default_permissions:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        default_events:
          type: array
          items:
            type: string
    GitHubAppSetupRequest:
      type: object
      additionalProperties: false
      required:
        - owner
      properties:
        owner:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
    InstallSetupError:
      type: object
      required:
        - code
        - class
        - message
      properties:
        code: &a1
          type: string
        class:
          type: string
          enum:
            - user
            - permission
            - capacity
            - github
            - infra
            - conflict
            - never
        message: *a1
        fix: *a1
    InstallSetupAddress:
      type: object
      additionalProperties: false
      required:
        - bind
        - origins
      properties:
        bind: *a1
        origins:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
    InstallSetupRepository:
      type: object
      additionalProperties: false
      required:
        - repository
      properties:
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    InstallSetupEmpty:
      type: object
      additionalProperties: false
      maxProperties: 0
    InstallSetupStatus:
      type: object
      required:
        - address
        - steps
        - this_mac
        - github
        - models
        - chatgpt
        - capacity
      properties:
        address:
          type: object
          required:
            - listen
            - bind
            - origins
          properties:
            listen:
              type: string
              enum:
                - mac
                - network
            bind: *a1
            origins:
              type: array
              items:
                type: string
                format: uri
        steps:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required:
              - id
              - state
            properties:
              id:
                type: string
                enum:
                  - address
                  - app_manifest
                  - sign_in
                  - repository
                  - models
                  - source
                  - machine
              state:
                type: string
                enum:
                  - pending
                  - running
                  - done
                  - blocked
                  - failed
              pct:
                type: integer
                minimum: 0
                maximum: 100
              error:
                $ref: "#/components/schemas/InstallSetupError"
              blocked:
                type: object
                required:
                  - line
                  - fix_url
                properties:
                  line: *a1
                  fix_url:
                    type: string
                    format: uri
        this_mac:
          type: object
          required:
            - memory_gb
            - disk_free_gb
            - capacity
          properties:
            memory_gb:
              type: number
              minimum: 0
            disk_free_gb:
              type: number
              minimum: 0
            capacity:
              type: integer
              minimum: 0
        github:
          type: object
          required:
            - signed_in
            - app_installed
          properties:
            owner: *a1
            signed_in:
              type: boolean
            app_installed:
              type: boolean
            squash_allowed:
              type: boolean
        repository:
          type: object
          required:
            - owner
            - name
          properties:
            owner: *a1
            name: *a1
        repositories:
          type: array
          items: *a1
        models:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required:
              - role
              - provider
              - key
            properties:
              role:
                type: string
                enum:
                  - fast
                  - coding
                  - jev
              provider: *a1
              key:
                type: string
                enum:
                  - none
                  - validating
                  - saved
                  - failed
              error: *a1
        chatgpt:
          type: boolean
        capacity:
          type: integer
          minimum: 0
        parallel:
          type: integer
          minimum: 0
