paths:
  /api/install:
    put:
      summary: Lower the install machine capacity
      operationId: put_api_install
      tags:
        - Install
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      description: Requires the install owner and write:user scope. Does not stop held machines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capacity]
              properties:
                capacity: {type: integer, minimum: 1}
      responses:
        '200':
          description: Updated host status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyJSON'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Host status unavailable
    get:
      summary: Read install setup and machine capacity
      operationId: get_api_install
      tags:
        - Install
      description: Setup details require the setup session until an owner exists, then the owner's browser session. Tokens with read:user scope read machine capacity only.
      security:
        - setupSession: []
        - sessionCookie: []
        - tokenAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: GitHub App setup status without credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppSetupStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Machine capacity unavailable
  /api/install/setup/app:
    post:
      summary: Begin or resume GitHub App setup
      operationId: post_api_install_setup_app
      tags:
        - Install
      description: Post the returned manifest to action_url in the same browser. Organization repositories require an organization owner to create the App at that URL. The callback consumes state once and refuses a second App.
      security:
        - setupSession: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppSetupRequest'
      responses:
        '200':
          description: Manifest and single-use browser state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppManifestStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This install already has a GitHub App
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    GitHubAppSetupRequest:
      type: object
      required:
        - owner_login
        - owner_kind
        - repository
      properties:
        resume:
          type: boolean
          description: Return the stored App installation URL without repeating conversion.
        owner_login:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
        owner_kind:
          type: string
          enum:
            - user
            - org
        repository:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
    GitHubAppSetupStatus:
      type: object
      properties:
        profile:
          type: object
          required: [memory_bytes, perf_cores, physical_cores, disk_free_bytes, macos_version, hypervisor]
          properties:
            memory_bytes: {type: integer, format: int64, minimum: 0}
            perf_cores: {type: integer, minimum: 0}
            physical_cores: {type: integer, minimum: 0}
            disk_free_bytes: {type: integer, format: int64, minimum: 0}
            macos_version: {type: string}
            hypervisor: {type: boolean}
        limits:
          type: object
          required: [memory_mib, cpus, capacity, layer_budget_bytes, memory_capacity, core_capacity, disk_capacity, limiting_term]
          properties:
            memory_mib: {type: integer, minimum: 1}
            cpus: {type: integer, minimum: 2, maximum: 4}
            capacity: {type: integer, minimum: 0}
            layer_budget_bytes: {type: integer, format: int64, minimum: 0}
            memory_capacity: {type: integer, minimum: 0}
            core_capacity: {type: integer, minimum: 0}
            disk_capacity: {type: integer, minimum: 0}
            limiting_term: {type: string, enum: [memory, cores, disk]}
            missing:
              type: integer
              format: int64
              minimum: 0
              description: Bytes for memory or disk; cores for the cores term. Present at capacity zero.
            fix: {type: string}
        machines:
          type: object
          required: [in_use, capacity]
          properties:
            in_use: {type: integer, minimum: 0}
            capacity: {type: integer, minimum: 0}
        github_app:
          type: object
          required:
            - configured
            - installed
          properties:
            configured:
              type: boolean
            installed:
              type: boolean
            slug:
              type: string
            installation_id:
              type: integer
              format: int64
            install_url:
              type: string
            callback_urls:
              type: array
              maxItems: 10
              items:
                type: string
                format: uri
            callback_fixes:
              type: array
              items:
                $ref: '#/components/schemas/GitHubAppCallbackFix'
    GitHubAppCallbackFix:
      type: object
      required:
        - settings_url
        - add_url
      properties:
        settings_url:
          type: string
          format: uri
        add_url:
          type: string
          format: uri
    GitHubAppManifestStart:
      type: object
      required:
        - action_url
        - manifest
        - state
      properties:
        install_url:
          type: string
          format: uri
        action_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 64
          maxLength: 64
        manifest:
          $ref: '#/components/schemas/GitHubAppManifest'
    GitHubAppManifest:
      type: object
      required:
        - name
        - url
        - redirect_url
        - setup_url
        - callback_urls
        - public
        - hook_attributes
        - default_permissions
        - default_events
      properties:
        name:
          type: string
          maxLength: 34
        url:
          type: string
          format: uri
        redirect_url:
          type: string
          format: uri
        setup_url:
          type: string
          format: uri
        callback_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        public:
          type: boolean
          const: false
        hook_attributes:
          type: object
          required:
            - url
            - active
          properties:
            url:
              type: string
              format: uri
            active:
              type: boolean
              const: false
        default_permissions:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        default_events:
          type: array
          items:
            type: string
