paths:
  /api/proposals:
    get:
      x-composition: install
      summary: Read learning proposals
      operationId: get_api_proposals
      tags:
        - Proposals
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Proposal cards for the install repository
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LearningProposalCard'}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
  /api/proposals/{id}/accept:
    post:
      x-composition: install
      summary: Make a TODO from a learning proposal
      operationId: post_api_proposals_id_accept
      tags:
        - Proposals
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '202':
          description: Proposal accepted with its one ordinary TODO
          content:
            application/json:
              schema: {"oneOf":[{"$ref":"#/components/schemas/LearningProposalCard"},{"$ref":"#/components/schemas/ConfirmationReceipt"}]}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: Proposal absent from the install repository}
        '409': {description: Proposal dismissed}
        '503': {description: TODO append unavailable; proposal remains pending}
  /api/proposals/{id}/dismiss:
    post:
      x-composition: install
      summary: Dismiss a learning proposal
      operationId: post_api_proposals_id_dismiss
      tags:
        - Proposals
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '202':
          description: Dismissed; repeated dismissal retains its first timestamp
          content:
            application/json:
              schema: {"oneOf":[{"$ref":"#/components/schemas/LearningProposalCard"},{"$ref":"#/components/schemas/ConfirmationReceipt"}]}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: Proposal absent from the install repository}
        '409': {description: Proposal accepted}
components:
  schemas:
    LearningProposalCard:
      type: object
      required: [id, title, evidence, refs, state]
      properties:
        id: {type: string}
        title: {type: string}
        evidence: {type: array, items: {type: string}}
        refs:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: {type: string}
              url: {type: string, format: uri}
        state: {type: string, enum: [open, accepted, dismissed]}
        todo:
          type: object
          required: [n, title]
          properties:
            n: {type: integer, minimum: 1}
            title: {type: string}
