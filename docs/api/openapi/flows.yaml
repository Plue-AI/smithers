paths:
  /api/flows:
    get:
      x-composition: install
      summary: Read the install's flow catalog
      description: Each overridable flow with its versions, as the Flow card shows it. The TODO flow is built in and Active at its digest until the repository overrides it. No system flow is listed. Open TODO candidate diffs supply proposed versions and their TODO numbers. A failed merged load retains the previous Active version and exposes its error. Any member's browser session reads it.
      operationId: get_api_flows
      tags:
        - Flows
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Flow card models; FlowCardSchema in packages/rpc/src/FlowCard.ts is the full contract
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowCard'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessError'
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '503':
          description: Flows unavailable
  /api/flows/{name}:
    get:
      x-composition: install
      summary: Read one flow
      description: Resolves an overridable flow from the install catalog, or an install-owned system name as built in. This read never loads repository code.
      operationId: get_api_flows_name
      tags:
        - Flows
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Flow card model
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowCard'}
        '401':
          description: Not signed in
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404':
          description: No such flow
        '503':
          description: Flows unavailable
  /api/flows/{name}/edit:
    post:
      x-composition: install
      summary: Propose a flow edit as a TODO
      description: Delegated callers receive a private confirmation bound to the Active flow version. Only the requesting person's session can commit it. The diff is quoted as untrusted context, never applied or executed. System flows refuse edits.
      operationId: post_api_flows_name_edit
      tags:
        - Flows
      security: [{sessionCookie: []}, {tokenAuth: []}]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                name: {type: string}
                request: {type: string, minLength: 1}
                diff: {type: string}
      responses:
        '202': {description: Private pending confirmation for a delegated caller, or an admitted TODO for a person's session}
        '400': {description: Invalid request}
        '401': {description: Not signed in}
        '403': {$ref: '#/components/responses/AuthorizationForbidden'}
        '404': {description: No Active flow version}
        '409': {description: Built-in system flow or idempotency mismatch}
        '503': {description: Confirmation or TODO consumer unavailable}
components:
  schemas:
    FlowCard:
      type: object
      required: [name, source, system, versions]
      properties:
        name: {type: string}
        source:
          description: '{"builtin": true} for the install''s version, or {"path": "flows/<name>/flow.ts"} for the repository''s'
          type: object
          properties:
            builtin: {type: boolean}
            path: {type: string}
        system:
          description: A system flow is never overridable and has no Edit; a built-in flow need not be one.
          type: boolean
        versions:
          type: array
          items:
            type: object
            required: [id, state, steps]
            properties:
              id:
                description: The loaded version's digest, or a provisional immutable candidate identity before loading
                type: string
              state: {type: string, enum: [active, proposed, merged-syncing, merged-failed, previous]}
              todo: {type: integer, minimum: 1}
              error: {type: string}
              steps:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: {type: string}
                    label: {type: string}
                    wait: {type: boolean}
                    signals:
                      type: array
                      items:
                        type: object
                        required: ['on', to]
                        properties:
                          'on': {type: string, enum: [rebase, steer]}
                          to: {type: string}
