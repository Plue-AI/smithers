components:
  securitySchemes:
    setupSession:
      type: apiKey
      in: cookie
      name: smithers_setup_session
      description: Live durable setup session exchanged from the terminal setup URL before claim.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use `Authorization: token smithers_...`.'
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Use `Authorization: Bearer smithers_...`.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: smithers_session
    workerExchangeBearer:
      type: http
      scheme: bearer
      description: Shared first-party Worker secret from auth.worker_exchange_token / SMITHERS_AUTH_WORKER_EXCHANGE_TOKEN.
  schemas:
    AppBootstrap:
      type: object
      required:
        - apiVersion
        - host
        - version
        - buildSha
        - capabilities
        - authFlow
        - sandbox
      properties:
        apiVersion:
          type: integer
          const: 1
        host:
          type: string
          const: cloud
        version:
          type: string
        buildSha:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
              - identity
              - agent
              - github
              - model.turn
              - recommend
              - cloud
              - cloud.terminal
              - billing.balance
              - billing.overview
              - billing.plans
              - billing.portal
              - billing.checkout
        authFlow:
          type: string
          enum:
            - none
            - credentials
            - redirect
        sandbox:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - platform
                - mode
              properties:
                platform:
                  type: string
                mode:
                  type: string
                  enum:
                    - trusted-only
                    - enforced
    BillingPlan:
      type: object
      required:
        - key
        - display_name
        - price_cents
        - interval
        - limits
        - checkout_available
      properties:
        key:
          type: string
          enum:
            - free
            - pro
            - max
        display_name:
          type: string
        price_cents:
          type: integer
          format: int64
          description: Monthly display price; Stripe is the source of truth for charges.
        interval:
          type: string
          enum:
            - monthly
            - annual
        checkout_available:
          type: boolean
        limits:
          type: object
          required:
            - concurrent_sandboxes
            - idle_timeout_secs
            - hours_per_day
            - private_repos
            - storage_bytes
            - ci_minutes
            - agent_runs
            - seats
          properties:
            concurrent_sandboxes:
              type: integer
              format: int64
            idle_timeout_secs:
              type: integer
              format: int64
            hours_per_day:
              type: integer
              format: int64
            private_repos:
              type: integer
              format: int64
            storage_bytes:
              type: integer
              format: int64
            ci_minutes:
              type: integer
              format: int64
            agent_runs:
              type: integer
              format: int64
            seats:
              type: integer
              format: int64
    BillingPlansResponse:
      type: object
      required:
        - plans
        - current_plan_key
      properties:
        current_plan_key:
          type: string
        plans:
          type: array
          items:
            $ref: '#/components/schemas/BillingPlan'
    SandboxEntitlement:
      type: object
      required:
        - plan_key
        - concurrent_sandboxes
        - concurrent_in_use
        - idle_timeout_secs
        - hours_per_day
        - seconds_used_today
        - day_resets_at
      properties:
        plan_key:
          type: string
        concurrent_sandboxes:
          type: integer
          format: int64
        concurrent_in_use:
          type: integer
          format: int64
        idle_timeout_secs:
          type: integer
          format: int64
          description: Zero means never auto-suspend.
        hours_per_day:
          type: integer
          format: int64
          description: Minus one means unlimited.
        seconds_used_today:
          type: integer
          format: int64
        day_resets_at:
          type: string
          format: date-time
        concurrent_children:
          type: integer
          format: int64
          description: Live child workspaces the plan allows, at most 128.
        child_max_ttl_secs:
          type: integer
          format: int64
          description: The longest a child workspace may live.
    AnyJSON:
      description: Endpoint-specific JSON response.
    IssueCommentOrigin:
      description: Where a comment was written. Comments created from a synced Slack or Telegram message carry that provider; every other comment was written in the app.
      type: string
      enum:
        - app
        - slack
        - telegram
    IssueComment:
      type: object
      additionalProperties: true
      required:
        - id
        - issue_id
        - user_id
        - commenter
        - body
        - type
        - origin
        - created_at
        - updated_at
      properties:
        idempotency_key:
          type: string
        persona:
          type: object
        id:
          type: integer
          format: int64
        issue_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        commenter:
          type: string
        body:
          type: string
        type:
          type: string
        origin:
          $ref: '#/components/schemas/IssueCommentOrigin'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueLastComment:
      description: The issue's newest comment.
      type: object
      required:
        - commenter
        - excerpt
        - origin
        - created_at
      properties:
        commenter:
          type: string
        persona:
          type: object
        excerpt:
          description: The first 200 characters of the comment.
          type: string
          maxLength: 200
        origin:
          $ref: '#/components/schemas/IssueCommentOrigin'
        created_at:
          type: string
          format: date-time
    Issue:
      type: object
      additionalProperties: true
      required:
        - kind
        - visibility
        - id
        - number
        - title
        - body
        - state
        - author
        - comment_count
        - last_comment
        - created_at
        - updated_at
      properties:
        idempotency_key:
          type: string
        kind:
          type: string
        visibility:
          type: string
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        state:
          type: string
        author:
          type: object
        comment_count:
          type: integer
          format: int64
        last_comment:
          oneOf:
            - $ref: '#/components/schemas/IssueLastComment'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitMirrorSyncRunStatus:
      type: object
      required:
        - state
        - behind_refs
        - failed_refs
        - started_at
        - finished_at
        - refs
      properties:
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        behind_refs:
          type: integer
          minimum: 0
        failed_refs:
          type: integer
          minimum: 0
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        refs:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
    SyncRunAccepted:
      type: object
      required:
        - run_id
      properties:
        run_id:
          type: integer
          format: int64
      additionalProperties: false
    ChangeFinding:
      type: object
      required:
        - id
        - seq
        - commit_id
        - analyzer
        - source
        - path
        - line
        - side
        - severity
        - text
        - state
        - created_at
      properties:
        id:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
          minimum: 1
        commit_id:
          type: string
        analyzer:
          type: string
          minLength: 1
        source:
          type: string
          enum:
            - analyzer
            - reviewer
        path:
          type: string
          minLength: 1
        line:
          type: integer
          format: int64
          minimum: 1
        side:
          type: string
          enum:
            - left
            - right
            - both
        severity:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        suggestion:
          type: string
        anchor_hash:
          type: string
        feedback:
          type: string
          enum:
            - useful
            - not_useful
            - fixed
        state:
          type: string
          enum:
            - current
            - stale
            - moved
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    ChangeAnalyzerRun:
      type: object
      required:
        - name
        - state
        - seq
        - started_at
        - finished_at
      properties:
        name:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - queued
            - running
            - done
            - failed
            - paused
        seq:
          type: integer
          format: int64
          minimum: 1
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        paused_by:
          type: string
        paused_reason:
          type: string
        failure_reason:
          type: string
      additionalProperties: false
    ChangeFindingsResponse:
      type: object
      required:
        - change_id
        - current_seq
        - findings
        - analyzers
      properties:
        change_id:
          type: string
        current_seq:
          type: integer
          format: int64
          minimum: 1
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ChangeFinding'
        analyzers:
          type: array
          items:
            $ref: '#/components/schemas/ChangeAnalyzerRun'
      additionalProperties: false
    ResolveChangeConflictRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          minLength: 1
      additionalProperties: false
    ResolveChangeConflictResponse:
      type: object
      required:
        - agent_session_id
      properties:
        agent_session_id:
          type: string
          format: uuid
      additionalProperties: false
    SandboxEgressAuditEntries:
      type: array
      items:
        $ref: '#/components/schemas/SandboxEgressAuditEntry'
    SandboxEgressAuditEntry:
      type: object
      required:
        - occurred_at
        - host
        - method
        - path
        - status
        - allowed
        - swapped_secret_names
      properties:
        occurred_at:
          type: string
          format: date-time
        host:
          type: string
          maxLength: 253
        method:
          type: string
          maxLength: 16
        path:
          type: string
          maxLength: 2048
          description: Request path with the query string removed.
        status:
          type: integer
          minimum: 0
          maximum: 999
        allowed:
          type: boolean
        swapped_secret_names:
          type: array
          maxItems: 64
          items:
            type: string
      additionalProperties: false
    MultiWorkflowRunsResponse:
      type: object
      required:
        - workflow_runs
      properties:
        workflow_runs:
          type: array
          items:
            $ref: '#/components/schemas/MultiWorkflowRun'
      additionalProperties: true
    MultiWorkflowRun:
      type: object
      required:
        - id
        - repository_id
        - workflow_definition_id
        - status
        - trigger_event
        - trigger_ref
        - trigger_commit_sha
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        repository_id:
          type: integer
          format: int64
        workflow_definition_id:
          type: integer
          format: int64
        status:
          type: string
        trigger_event:
          type: string
