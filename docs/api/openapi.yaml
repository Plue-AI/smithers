    post:
      summary: Spawn children of a workspace
      description: Admits a batch of short-lived children that boot from one snapshot of the running workspace, then boots them in the background. Children start signed out, carry no repository secret, count against the plan's child limit and its sandbox hours, and stop with their parent. The workspace's own children credential may call it, unless another person can write into the workspace.
      operationId: post_api_repos_owner_repo_workspaces_id_children
      tags:
        - Repositories
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
