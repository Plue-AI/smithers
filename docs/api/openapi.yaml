          in: path
          required: true
          description: The parent workspace.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 128
                profile:
                  type: string
                  enum: [small, build]
                  description: small (1 vCPU, 2 GB) by default; build is 2 vCPU, 8 GB.
                ttl_secs:
                  type: integer
                  minimum: 0
                  description: How long the batch may live; zero takes the default, capped by the plan.
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '202':
