openapi: 3.1.0
info:
  title: Smithers API
  version: 1.0.0
  description: >-
    Pre-release Smithers product API. TestOpenAPIDescribesEveryServedRoute in packages/backend/internal/compose fails when a served route and this document disagree; schemas are being tightened during product extraction.
    An operation marked `x-smithers-opaque-body: true` accepts a request body that is opaque or user-authored by design: file and blob bytes and their transfer manifests, shell lines and setup scripts, secret values, model prompts, and signed third-party webhooks.
    Edge filters that match attack signatures in request bodies, such as a deployment's WAF, must skip these operations; the backend authenticates and bounds them itself.
    Only POST, PUT, and PATCH operations carry it, as the boolean true; docs/api/openapi_opaque_body_test.go enforces both.
servers:
  - url: /
    description: Same-origin Smithers backend
paths:
  /api/admin/grant:
    post:
      x-composition: plue
      summary: Grant credit to a user
      description: Requires a verified administrator and write:admin for personal access tokens. The operation key globally binds the recipient, amount and administrator; retries return the original receipt.
      operationId: post_api_admin_grant
      tags:
        - Admin
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreditGrantRequest'
      responses:
        '200':
          description: Committed credit receipt; duplicate identifies a retry of the original grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreditGrantReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation key already binds a different grant
        '413':
          description: Request body exceeds the product JSON limit
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
