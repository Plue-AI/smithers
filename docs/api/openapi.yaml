                  parent_workspace_id:
                    type: string
                  profile:
                    type: string
                    enum: [small, build]
                  expires_at:
                    type: string
                    format: date-time
                  children:
                    type: array
                    items:
                      type: object
                      required: [workspace_id, batch_id, ordinal, profile, status, expires_at]
                      properties:
                        workspace_id:
                          type: string
                        batch_id:
                          type: string
                        ordinal:
                          type: integer
                        profile:
                          type: string
                          enum: [small, build]
                        status:
                          type: string
                        vm_id:
                          type: string
                        snapshot_id:
                          type: string
                        started_at:
                          type: string
                          format: date-time
                        stopped_at:
                          type: string
                          format: date-time
                        stop_reason:
                          type: string
                          enum: [requested, parent_stopped, expired, idle, failed, abandoned]
