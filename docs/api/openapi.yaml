        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{username}/export:
    post:
      x-composition: plue
      summary: POST /api/admin/users/{username}/export
      description: Returns the account's data as a gzip-compressed tar archive, built in full before the response starts. The archive holds profile.json, repositories.json, one cloneable git bundle per owned repository under repositories/, issues.json, comments.json, landing_requests.json, runs.json, and manifest.json listing every other file with its size, SHA-256 and record count. Each export writes an admin.user.export audit event.
      operationId: post_api_admin_users_username_export
      tags:
