          format: uri
    GitHubAppManifestStart:
      type: object
      required:
        - action_url
        - manifest
        - state
      properties:
        install_url:
          type: string
          format: uri
        action_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 64
          maxLength: 64
        manifest:
          $ref: '#/components/schemas/GitHubAppManifest'
    GitHubAppManifest:
      type: object
      required:
        - name
        - url
        - redirect_url
        - setup_url
        - callback_urls
        - public
        - hook_attributes
        - default_permissions
        - default_events
      properties:
        name:
          type: string
          maxLength: 34
        url:
          type: string
          format: uri
        redirect_url:
          type: string
          format: uri
        setup_url:
          type: string
          format: uri
        callback_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        public:
          type: boolean
          const: false
        hook_attributes:
          type: object
          required:
            - url
            - active
          properties:
            url:
              type: string
              format: uri
            active:
              type: boolean
              const: false
        default_permissions:
          type: object
          additionalProperties:
            type: string
            enum:
              - read
              - write
        default_events:
          type: array
          items:
            type: string
    GitHubAppSetupRequest:
      type: object
      additionalProperties: false
      required:
        - owner
      properties:
        owner:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
    InstallSetupError:
      type: object
      required:
        - code
        - class
        - message
      properties:
        code: &a1
          type: string
        class:
          type: string
          enum:
            - user
            - permission
            - capacity
            - github
            - infra
            - conflict
            - never
        message: *a1
        fix: *a1
    InstallSetupAddress:
      type: object
      additionalProperties: false
      required:
        - bind
        - origins
      properties:
        bind: *a1
        origins:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
    InstallSetupRepository:
      type: object
      additionalProperties: false
      required:
        - repository
      properties:
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    InstallSetupEmpty:
      type: object
      additionalProperties: false
      maxProperties: 0
    InstallSetupStatus:
      type: object
      required:
        - address
        - steps
        - this_mac
        - github
        - models
        - chatgpt
        - capacity
      properties:
        address:
          type: object
          required:
            - listen
            - bind
            - origins
          properties:
            listen:
              type: string
              enum:
                - mac
                - network
            bind: *a1
            origins:
              type: array
              items:
                type: string
                format: uri
        steps:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required:
              - id
              - state
            properties:
              id:
                type: string
                enum:
                  - address
                  - app_manifest
                  - sign_in
                  - repository
                  - models
                  - source
                  - machine
              state:
                type: string
                enum:
                  - pending
                  - running
                  - done
                  - blocked
                  - failed
              pct:
                type: integer
                minimum: 0
                maximum: 100
              error:
                $ref: "#/components/schemas/InstallSetupError"
              blocked:
                type: object
                required:
                  - line
                  - fix_url
                properties:
                  line: *a1
                  fix_url:
                    type: string
                    format: uri
        this_mac:
          type: object
          required:
            - memory_gb
            - disk_free_gb
            - capacity
          properties:
            memory_gb:
              type: number
              minimum: 0
            disk_free_gb:
              type: number
              minimum: 0
            capacity:
              type: integer
              minimum: 0
        github:
          type: object
          required:
            - signed_in
            - app_installed
          properties:
            owner: *a1
            signed_in:
              type: boolean
            app_installed:
              type: boolean
            squash_allowed:
              type: boolean
        repository:
          type: object
          required:
            - owner
            - name
          properties:
            owner: *a1
            name: *a1
        repositories:
          type: array
          items: *a1
        models:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required:
              - role
              - provider
              - key
            properties:
              role:
                type: string
                enum:
                  - fast
                  - coding
                  - jev
              provider: *a1
              key:
                type: string
                enum:
                  - none
                  - validating
                  - saved
                  - failed
              error: *a1
        chatgpt:
          type: boolean
        capacity:
          type: integer
          minimum: 0
        parallel:
          type: integer
          minimum: 0
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Memory service unavailable; the request may be retried
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
