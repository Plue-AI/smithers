  /api/repos/{owner}/{repo}/egress-policy:
    get:
      summary: GET /api/repos/{owner}/{repo}/egress-policy
      description: The hosts every sandbox of this repository may call out to in addition to the deployment's list, which always stays reachable. An empty list leaves exactly the deployment list. Hosts a secret is bound to stay reachable either way. Owner only.
      operationId: get_api_repos_owner_repo_egress_policy
      tags:
        - Repositories
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      x-required-token-scope: write:repository
      x-required-repository-permission: owner
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The repository's egress allowlist
          content:
            application/json:
              schema:
                type: object
                required:
                  - allow_domains
                properties:
                  allow_domains:
                    type: array
                    description: Lower-case host names and `*.domain` wildcards, sorted.
                    items:
                      type: string
                  updated_at:
                    type: string
                    format: date-time
                    description: When the list was last written; absent when it never was.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: PATCH /api/repos/{owner}/{repo}/egress-policy
      description: Adds and removes hosts in one atomic write, then reloads the resulting list into every running workspace and agent session of the repository without restarting them. Overlapping writers each apply their own change; there is no whole-list write to overwrite another's. Adding a listed host or removing an unlisted one changes nothing and still reloads. New and resumed sandboxes start with the list. Refuses `*`, IP addresses and ranges, names that are not hosts, a host both added and removed, a body naming no host, and a result over 200 hosts. A sandbox whose reload fails keeps running and reports its error; it gets the list when it next starts. Owner only.
      operationId: patch_api_repos_owner_repo_egress_policy
      tags:
        - Repositories
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                add:
                  type: array
                  description: Hosts to allow. Host names and `*.domain` wildcards; case, duplicates and a trailing dot are normalised away.
                  items:
                    type: string
                remove:
                  type: array
                  description: Hosts to stop allowing, normalised the same way. Removing the last host returns every sandbox to exactly the deployment list.
                  items:
                    type: string
      x-required-token-scope: write:repository
      x-required-repository-permission: owner
      security:
        - tokenAuth: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The stored allowlist and each running sandbox's reload
          content:
            application/json:
              schema:
                type: object
                required:
                  - allow_domains
                  - reloads
                properties:
                  allow_domains:
                    type: array
                    items:
                      type: string
                  updated_at:
                    type: string
                    format: date-time
                  reloads:
                    type: array
                    items:
                      type: object
                      required:
                        - sandbox_id
                        - reloaded
                      properties:
                        sandbox_id:
                          type: string
                        reloaded:
                          type: boolean
                        error:
                          type: string
                          description: Why this sandbox kept its previous list; absent when it reloaded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
