          case "$SMTHRS_INPUT_CACHE_TOKEN" in *"$delimiter"*) exit 1 ;; esac
          printf '%s<<%s\n' SMITHERS_CACHE_TOKEN "$delimiter" >> "$GITHUB_ENV"
          printf '%s\n' "$SMTHRS_INPUT_CACHE_TOKEN" >> "$GITHUB_ENV"
