version: "2"
# Product migrations are the only authored product DDL.
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/"
    strict_function_checks: true
    gen:
      go:
        package: "db"
        out: "../../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "tsvector"
            go_type: "string"
          - db_type: "pg_catalog.tsvector"
            go_type: "string"
          - column: "users.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
          - column: "repositories.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
          - column: "issues.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
          - column: "issue_state_facts.audience_user_id"
            go_struct_tag: 'json:"-"'
