name: smithers review
description: Review pull requests with smithers. Zero secrets — the service authenticates your repo via GitHub OIDC, runs the review on metered inference, and posts the review onto the PR.
author: smithers

inputs:
  service-url:
    description: Base URL of the smithers review service.
    required: false
    default: https://review.jjhub.tech
  quiz:
    description: "Reviewer comprehension quiz mode: off, auto, or on. Empty uses the service/CLI default."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.1

    # working-directory on the bun steps keeps bun away from any bunfig.toml
    # in the workspace checkout (bun reads bunfig from its cwd; a workspace
    # preload would force auto-install of deps that are not installed there).
    - name: Gate the event
      id: gate
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GH_TOKEN: ${{ github.token }}
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
      run: bun "$SMITHERS_ACTION_PATH/src/runGate.ts"

    - name: Set up pnpm
      if: steps.gate.outputs.should-run == 'true'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 11.25.0
        run_install: false

    - name: Set up node
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 26.4.0

    # The review host resolves jj while it is built. Keep a caller's supported
    # jj (0.39.0 or newer); otherwise install the release CI pins.
    - name: Find jj
      id: jj
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      run: |
        found="$(jj --version 2>/dev/null | awk '{print $2}' || true)"
        if [ -n "$found" ] && [ "$(printf '%s\n' 0.39.0 "$found" | sort -V | head -n 1)" = 0.39.0 ]; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install jj
      if: steps.gate.outputs.should-run == 'true' && steps.jj.outputs.supported != 'true'
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
      with:
        tool: jj-cli@0.39.0

    # Check out before installing: when this action runs from the caller's own
    # checkout (`uses: ./apps/review/action`), the install lands in that
    # checkout, and checkout's clean would delete its ignored node_modules.
    - name: Check out the user's repository
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Install smithers dependencies
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
      run: pnpm -C "$SMITHERS_ACTION_PATH/../../.." --filter @smthrs/review... install --frozen-lockfile

    - name: Authenticate and review
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
        SMITHERS_REVIEW_SERVICE_URL: ${{ inputs.service-url }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GH_TOKEN: ${{ github.token }}
        SMITHERS_REVIEW_QUIZ: ${{ inputs.quiz }}
      run: bun "$SMITHERS_ACTION_PATH/src/runAction.ts"
