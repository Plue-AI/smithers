<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Smithers</title>
    <!--
      §20.4 — the appearance bootstrap.

      The chosen theme and palette live in the app store, which is asynchronous
      by construction (OPFS/wa-sqlite), so they were stamped 155-290ms after
      first paint: a user on dark watched the app paint white on every load.
      This script runs synchronously before the first paint from a localStorage
      mirror AppStore keeps beside the store (state/Appearance.ts), and falls
      back to the OS preference on a first run, so the first frame is already
      the right one. It is inline on purpose — an external module is deferred,
      and a deferred stamp is the bug.
    -->
    <script>
      (function (window, document) {
        document.documentElement.setAttribute("data-palette", "paper");
        try {
          var storage = window.localStorage;
          var theme = storage && storage.getItem("smithers-mvp.theme");
          if (theme !== "light" && theme !== "dark") {
            theme =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          // A storage the browser refuses (private mode, disabled cookies) is
          // not a reason to paint nothing: light is the built-in default.
          document.documentElement.setAttribute("data-theme", "light");
        }
      })(window, document);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
