[package]
name = "testutils"
version = "0.44.0"
edition = "2024"
description = "Integration test utils for the jj-lib crate"
license = "Apache-2.0"
homepage = "https://www.jj-vcs.dev/"
repository = "https://github.com/jj-vcs/jj"
documentation = "https://docs.jj-vcs.dev/"
rust-version = "1.89"
autotests = false
autobenches = false
publish = false

[lib]
name = "testutils"
path = "src/lib.rs"

[dependencies."async-trait"]
version = "^0.1.89"
default-features = true
optional = false
features = []

[dependencies."bstr"]
version = "^1.12.1"
default-features = true
optional = false
features = ["serde"]

[dependencies."eyre"]
version = "^0.6"
default-features = true
optional = false
features = []

[dependencies."futures"]
version = "^0.3.32"
default-features = true
optional = false
features = []

[dependencies."gix"]
version = "^0.85.0"
default-features = false
optional = false
features = ["attributes", "blob-diff", "index", "max-performance-safe", "sha1", "sha256", "zlib-rs", "status", "tree-editor", "worktree-mutation"]

[dependencies."itertools"]
version = "^0.15.0"
default-features = true
optional = false
features = []

[dependencies."jj-lib"]
version = "^0.44.0"
path = ".."
default-features = false
optional = false
features = ["testing"]

[dependencies."pollster"]
version = "^1.0.1"
default-features = true
optional = false
features = []

[dependencies."proptest"]
version = "^1.11.0"
default-features = true
optional = false
features = []

[dependencies."proptest-derive"]
version = "^0.8.0"
default-features = true
optional = false
features = []

[dependencies."proptest-state-machine"]
version = "^0.8.0"
default-features = true
optional = false
features = []

[dependencies."rand"]
version = "^0.10.1"
default-features = true
optional = false
features = []

[dependencies."tempfile"]
version = "^3.27.0"
default-features = true
optional = false
features = []

[dependencies."tokio"]
version = "^1.52.3"
default-features = true
optional = false
features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"]

[dependencies."toml_edit"]
version = "^0.25.12"
default-features = true
optional = false
features = ["serde"]

[features]

[lints.clippy]
"borrow_as_ptr" = "warn"
"cast_lossless" = "warn"
"cloned_instead_of_copied" = "warn"
"elidable_lifetime_names" = "warn"
"explicit_into_iter_loop" = "warn"
"explicit_iter_loop" = "warn"
"flat_map_option" = "warn"
"format_collect" = "warn"
"format_push_string" = "warn"
"implicit_clone" = "warn"
"manual_let_else" = "warn"
"needless_for_each" = "warn"
"ptr_as_ptr" = "warn"
"ptr_cast_constness" = "warn"
"ref_as_ptr" = "warn"
"ref_option" = "warn"
"semicolon_if_nothing_returned" = "warn"
"single_char_pattern" = "warn"
"stable_sort_primitive" = "warn"
"uninlined_format_args" = "warn"
"unnecessary_literal_bound" = "warn"
"unnecessary_semicolon" = "warn"
"unnested_or_patterns" = "warn"
"unused_trait_names" = "warn"
"use_self" = "warn"
"useless_conversion" = "warn"
"while_let_loop" = "warn"

[lints.rust]
"let_underscore_drop" = "warn"
"redundant_imports" = "warn"
