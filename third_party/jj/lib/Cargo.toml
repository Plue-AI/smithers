[package]
name = "jj-lib"
version = "0.44.0"
edition = "2024"
description = "Library for Jujutsu - an experimental version control system"
license = "Apache-2.0"
homepage = "https://www.jj-vcs.dev/"
repository = "https://github.com/jj-vcs/jj"
documentation = "https://docs.jj-vcs.dev/"
rust-version = "1.89"
autotests = false
autobenches = false

[lib]
name = "jj_lib"
path = "src/lib.rs"

[[test]]
name = "runner"
path = "tests/runner.rs"
harness = true

[[bench]]
name = "diff_bench"
path = "benches/diff_bench.rs"
harness = false

[dependencies."async-trait"]
version = "^0.1.89"
default-features = true
optional = false
features = []

[dependencies."blake2"]
version = "^0.10.6"
default-features = true
optional = false
features = []

[dependencies."bstr"]
version = "^1.12.1"
default-features = true
optional = false
features = ["serde"]

[dependencies."chrono"]
version = "^0.4.44"
